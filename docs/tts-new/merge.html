// ─────────── 트리 빌드 (L0 연도 > L1 과목 > L2 카테고리 > L3 파일 > L4 Case) ───────────
//
// 데이터 소스:
//   1. 풍부 메타 있는 파일 (fileMetadata[path]) → subjectKor + category + fileKor + case + points + title 활용 (5단 트리)
//   2. type==="library" 두문자 등 → libraryTree (별도 2단 평탄 분기)
//   3. 풍부 메타 없는 파일 → dir 그대로 L1=dir, L3=filename 단일 트리로 fallback
function renderTree(filter = '') {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = '';
  const lowerFilter = (filter || '').toLowerCase();
  const searching = lowerFilter.length > 0;

  // 트리 구조 빌드
  //   tree5 = Map<year, Map<subjectKor, {subject, subjectKor, categories: Map<category, {category, files: Map<fileCode, {fileCode, fileKor, items: [meta], dir}>}>}>>
  //   libraryTree = Map<subjectKor, {subjectKor, items: [{meta, filename, path, dir}]}>  ← type==="library" 평탄 트리 (year 분리 X — 변경 X)
  //   noMeta = Map<dir, [{filename, path}]>  ← 메타 없는 파일들
  const tree5 = new Map();
  const libraryTree = new Map();
  const noMeta = new Map();

  for (const [dir, files] of Object.entries(fileIndex)) {
    for (const f of files) {
      const path = `${dir}/${f}`;
      const meta = fileMetadata[path];
      // 17896 정본 필터 (all/err/stale/book)
      if (!filterMatch(meta || {}, path)) continue;
      // 필터링: search term 매칭
      if (searching) {
        const hay = [
          f, path, dir,
          meta && meta.subjectKor, meta && meta.category, meta && meta.fileKor,
          meta && meta.file, meta && meta.title, meta && meta.id,
          meta && meta.type, meta && meta.case,
          displayFile(f), displayDir(dir),
          meta && displaySubject(meta.subjectKor),
        ].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(lowerFilter)) continue;
      }
      if (meta && meta.type === 'library' && meta.subjectKor) {
        // 라이브러리: meta.round 있으면 3단(L1 subjectKor → L2 round → L3 case),
        //            없으면 기존 2단 평탄(L1 subjectKor → L2 case)
        const sk = meta.subjectKor;
        if (!libraryTree.has(sk)) libraryTree.set(sk, { subjectKor: sk, subject: meta.subject, items: [], rounds: new Map() });
        const libNode = libraryTree.get(sk);
        if (meta.round) {
          if (!libNode.rounds.has(meta.round)) libNode.rounds.set(meta.round, []);
          libNode.rounds.get(meta.round).push({ meta, filename: f, path, dir });
        } else {
          libNode.items.push({ meta, filename: f, path, dir });
        }
      } else if (meta && meta.subjectKor && meta.category && meta.fileKor) {
        const sk = meta.subjectKor;
        const cat = meta.category;
        const fileCode = meta.file || meta.fileKor;
        // 연도 추출: meta.id 첫 4자리 우선, slug형 id면 meta._year 폴백 (lawear-7ad6 v3 버그 1 fix)
        // user_input은 id가 '01_등기의_효력' 같은 slug 형식이라 _year 폴백 필수
        const year = (meta.id && /^\d{4}_/.test(meta.id))
          ? meta.id.slice(0, 4)
          : (meta._year || 'unknown');
        if (!tree5.has(year)) tree5.set(year, new Map());
        const yearNode = tree5.get(year);
        if (!yearNode.has(sk)) yearNode.set(sk, { subject: meta.subject, subjectKor: sk, categories: new Map() });
        const subjNode = yearNode.get(sk);
        if (!subjNode.categories.has(cat)) subjNode.categories.set(cat, { category: cat, files: new Map() });
        const catNode = subjNode.categories.get(cat);
        if (!catNode.files.has(fileCode)) catNode.files.set(fileCode, { fileCode, fileKor: meta.fileKor, items: [], dir });
        catNode.files.get(fileCode).items.push({ meta, filename: f, path, dir });
      } else {
        if (!noMeta.has(dir)) noMeta.set(dir, []);
        noMeta.get(dir).push({ filename: f, path });
      }
    }
  }

  // 빈 결과 처리
  if (tree5.size === 0 && libraryTree.size === 0 && noMeta.size === 0) {
    tree.innerHTML = '<div style="padding:16px;color:#484f58;font-size:12px;text-align:center;">매칭 결과 없음</div>';
    updateSelectedCount();
    return;
  }

  const state = loadTreeState();
  let html = '';

  // ─── 라이브러리 트리: 두문자/기출문제 = L0 (year와 동일 최상위 정렬) ───
  // 두문자=2단(L0 subjectKor → L1 case), 기출문제=3단(L0 → L1 round → L2 case)
  const sortedLibrary = Array.from(libraryTree.entries()).sort((a, b) => subjectRank(a[0]) - subjectRank(b[0]));
  for (const [sk, libNode] of sortedLibrary) {
    const l1Key = treeNodeKey('lib', sk);
    const l1Collapsed = !searching && state[l1Key] === false;
    // L0 카운트 = 평탄 items + rounds 산하 합
    let l1Total = libNode.items.length;
    for (const arr of libNode.rounds.values()) l1Total += arr.length;
    html += `<div class="tree-node tree-l0${l1Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l1Key)}">`;
    html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l1Key)}">`;
    html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displaySubject(sk))}</span>`;
    html += `<span class="tree-count">${l1Total}</span></div>`;
    html += `<div class="tree-body">`;

    // 회차 노드 (기출문제 패턴) — L1 round → L2 case (회차 숫자 내림차순, 최신 위)
    const sortedRounds = Array.from(libNode.rounds.entries()).sort((a, b) => roundRank(b[0]) - roundRank(a[0]));
    for (const [round, roundItems] of sortedRounds) {
      const l2Key = treeNodeKey('lib_round', sk, round);
      const l2Collapsed = !searching && state[l2Key] === false;
      html += `<div class="tree-node tree-l1${l2Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l2Key)}">`;
      html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l2Key)}">`;
      html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(round)}</span>`;
      html += `<span class="tree-count">${roundItems.length}</span></div>`;
      html += `<div class="tree-body">`;
      const sortedItems = roundItems.slice().sort((a, b) => pastSubjectRank(a.meta.case || '') - pastSubjectRank(b.meta.case || ''));
      for (const it of sortedItems) {
        const m = it.meta;
        const active = (currentPath === it.path) ? ' active' : '';
        const caseLabel = stealthMode ? (stealthSubjectMap[m.case] || stealthCategoryMap[m.case] || m.case || '') : (m.case || '');
        const title = (m.title || '').trim();
        const bm = isBookmarked(it.path);
        const starCls = bm ? 'pill bookmark-star bookmarked' : 'pill bookmark-star';
        const pills = [`<span class="${starCls}" data-bookmark-toggle="${escapeAttr(it.path)}" title="${bm ? 'Remove bookmark' : 'Add bookmark'}">★</span>`];
        html += `<div class="case-item${active}" data-path="${escapeAttr(it.path)}" style="padding-left: 30px;">`;
        html += `<div class="case-item-row">`;
        html += `<span class="case-id">${escapeHtml(caseLabel)}</span>`;
        html += `</div>`;
        html += `<div class="case-title" title="${escapeAttr(title)}">${escapeHtml(title)}</div>`;
        html += `<div class="case-meta">${pills.join('')}</div>`;
        html += `</div>`;
      }
      html += `</div></div>`;
    }

    // 평탄 items (두문자 패턴) — L1 case 직접
    const items = libNode.items.slice().sort((a, b) => (a.meta.case || '').localeCompare(b.meta.case || ''));
    for (const it of items) {
      const m = it.meta;
      const active = (currentPath === it.path) ? ' active' : '';
      const caseLabel = stealthMode ? (stealthCategoryMap[m.case] || m.case || '') : (m.case || '');
      const title = (m.title || '').trim();
      const bm = isBookmarked(it.path);
      const starCls = bm ? 'pill bookmark-star bookmarked' : 'pill bookmark-star';
      const pills = [`<span class="${starCls}" data-bookmark-toggle="${escapeAttr(it.path)}" title="${bm ? 'Remove bookmark' : 'Add bookmark'}">★</span>`];
      html += `<div class="case-item${active}" data-path="${escapeAttr(it.path)}" style="padding-left: 18px;">`;
      html += `<div class="case-item-row">`;
      html += `<span class="case-id">${escapeHtml(caseLabel)}</span>`;
      html += `</div>`;
      html += `<div class="case-title" title="${escapeAttr(title)}">${escapeHtml(title)}</div>`;
      html += `<div class="case-meta">${pills.join('')}</div>`;
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  // ─── 풍부 메타 트리 (L0 year > L1 과목 > L2 카테고리 > L3 파일 > L4 Case) ───
  // year 내림차순 정렬 (최신이 위), 'unknown'은 맨 아래
  const sortedYears = Array.from(tree5.entries()).sort((a, b) => {
    if (a[0] === 'unknown') return 1;
    if (b[0] === 'unknown') return -1;
    return b[0].localeCompare(a[0]);
  });
  for (const [year, yearNode] of sortedYears) {
    const l0Key = treeNodeKey('y', year);
    const l0Collapsed = !searching && state[l0Key] === false;
    // L0 (year) 카운트: 산하 모든 case 합산
    let l0TotalCases = 0;
    for (const subjNode of yearNode.values()) {
      for (const cat of subjNode.categories.values()) {
        for (const fileNode of cat.files.values()) l0TotalCases += fileNode.items.length;
      }
    }
    html += `<div class="tree-node tree-l0${l0Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l0Key)}">`;
    html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l0Key)}">`;
    html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(year)}</span>`;
    html += `<span class="tree-count">${l0TotalCases}</span></div>`;
    html += `<div class="tree-body">`;

    const sortedSubjects = Array.from(yearNode.entries()).sort((a, b) => subjectRank(a[0]) - subjectRank(b[0]));
    for (const [sk, subjNode] of sortedSubjects) {
      const l1Key = treeNodeKey('s', year, sk);
      const l1Collapsed = !searching && state[l1Key] === false;
      let l1TotalCases = 0;
      for (const cat of subjNode.categories.values()) {
        for (const fileNode of cat.files.values()) l1TotalCases += fileNode.items.length;
      }

      html += `<div class="tree-node tree-l1${l1Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l1Key)}">`;
      html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l1Key)}">`;
      html += `<input type="checkbox" class="dir-checkbox" data-subject="${escapeAttr(sk)}" onclick="event.stopPropagation(); toggleSubjectSelection('${escapeAttr(sk)}', this.checked);">`;
      html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displaySubject(sk))}</span>`;
      html += `<span class="tree-count">${l1TotalCases}</span></div>`;
      html += `<div class="tree-body">`;

      const sortedCats = Array.from(subjNode.categories.entries()).sort((a, b) => categoryRank(a[0]) - categoryRank(b[0]));
      for (const [cat, catNode] of sortedCats) {
        const l2Key = treeNodeKey('c', year, sk, cat);
        const l2Collapsed = !searching && state[l2Key] === false;
        let l2TotalCases = 0;
        for (const fileNode of catNode.files.values()) l2TotalCases += fileNode.items.length;

        html += `<div class="tree-node tree-l2${l2Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l2Key)}">`;
        html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l2Key)}">`;
        html += `<input type="checkbox" class="dir-checkbox" data-cat="${escapeAttr(sk + '|' + cat)}" onclick="event.stopPropagation(); toggleCategorySelection('${escapeAttr(sk)}', '${escapeAttr(cat)}', this.checked);">`;
        html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displayCategory(cat))}</span>`;
        html += `<span class="tree-count">${l2TotalCases}</span></div>`;
        html += `<div class="tree-body">`;

        const sortedFiles = Array.from(catNode.files.entries()).sort((a, b) => a[0].localeCompare(b[0]));
        for (const [fileCode, fileNode] of sortedFiles) {
          const l3Key = treeNodeKey('f', year, sk, cat, fileCode);
          // L3 디폴트: 검색 중이거나 펼침 저장된 경우만 펼침 (단, user_input 1-case 노드는 디폴트 펼침)
          const firstMeta = fileNode.items && fileNode.items[0] && fileNode.items[0].meta;
          const isUserInput = firstMeta && firstMeta.type === 'user_input';
          // lawear-0981 (2026-05-25) Q5 fix — 사용자 펼침 상태 우선 (localStorage state)
          //   기존: isUserInput 강제 펼침 → 사용자가 모고01만 펼쳐도 새로고침 시 모든 user_input L3 펼쳐짐
          //   변경: state[l3Key] 명시값 우선, 미저장 시에만 user_input 디폴트 펼침 적용
          //   우선순위: searching > state 명시값 > isUserInput 디폴트 > 일반 디폴트(접힘)
          let l3Collapsed;
          if (searching) {
            l3Collapsed = false;
          } else if (state[l3Key] === true) {
            l3Collapsed = false;  // 사용자 명시 펼침
          } else if (state[l3Key] === false) {
            l3Collapsed = true;   // 사용자 명시 접힘 (user_input이라도 사용자 의사 존중)
          } else {
            // 미저장 — 디폴트: user_input 펼침 / 일반 접힘
            l3Collapsed = isUserInput ? false : true;
          }
          // 파일명 표시 (lawear-7ad6 v4):
          //  - user_input: meta.file 직접 (예: "01_공유물분할") — 사용자 명시 파일명 그대로
          //  - 일반: fileKor에서 과목/카테고리 prefix 제거 (예: '민법_입문_미케_01' → '미케_01')
          let fileLabel;
          if (isUserInput && firstMeta.file) {
            fileLabel = firstMeta.file;
          } else {
            fileLabel = fileNode.fileKor || fileCode;
            fileLabel = fileLabel.replace(new RegExp(`^${sk}_${cat}_`), '').replace(new RegExp(`^${sk}_`), '');
          }
          if (stealthMode) fileLabel = displayFileKor(fileNode.fileKor, fileCode);

          html += `<div class="tree-node tree-l3${l3Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l3Key)}">`;
          html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l3Key)}">`;
          html += `<input type="checkbox" class="dir-checkbox" data-file="${escapeAttr(sk + '|' + cat + '|' + fileCode)}" onclick="event.stopPropagation(); toggleFileSelection('${escapeAttr(sk)}', '${escapeAttr(cat)}', '${escapeAttr(fileCode)}', this.checked);">`;
          html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(fileLabel)}</span>`;
          html += `<span class="tree-count">${fileNode.items.length}</span></div>`;
          html += `<div class="tree-body">`;

          // L4: Case 항목 (17896 정본: case-id 한 줄, case-title 한 줄, case-meta 한 줄 pills)
          const items = fileNode.items.slice().sort((a, b) => (a.meta.case || '').localeCompare(b.meta.case || ''));
          for (const it of items) {
            const m = it.meta;
            const checked = selectedFiles.has(it.path) ? ' checked' : '';
            const active = (currentPath === it.path) ? ' active' : '';
            // 17896 정본 short ID: <file>-<case_no>  (예: 미케01-01) / stealth: sub_01-01
            // lawear-7ad6 v4 — user_input L4:
            //   case-id-large = m.title (주제목)
            //   case-title    = m.case  (소제목)  — title 변수 swap
            const fileShort = stealthMode ? displayFileKor(m.fileKor, m.file) : m.file;
            const shortId = (m.type === 'user_input')
              ? (m.title || '주제목 미입력')
              : `${fileShort}-${m.case}`;
            const title = (m.type === 'user_input')
              ? (m.case || '').trim()      // 소제목 (case 자리)
              : (m.title || '').trim();

            // 17896 pills (points 항상, userCase 있을 때, bookmark star)
            const pills = [];
            if (m.points != null) pills.push(`<span class="pill">${m.points} pt</span>`);
            // err / stale 데이터 미지원 → skip (17896 데이터에만 있음)
            if (m.userCase != null && !stealthMode) pills.push(`<span class="pill stale">U${m.userCase}</span>`);
            // bookmark — localStorage 기반 (간단)
            const bm = isBookmarked(it.path);
            const starCls = bm ? 'pill bookmark-star bookmarked' : 'pill bookmark-star';
            pills.push(`<span class="${starCls}" data-bookmark-toggle="${escapeAttr(it.path)}" title="${bm ? 'Remove bookmark' : 'Add bookmark'}">★</span>`);

            html += `<div class="case-item${active}" data-path="${escapeAttr(it.path)}">`;
            html += `<div class="case-item-row">`;
            html += `<input type="checkbox" data-path="${escapeAttr(it.path)}"${checked} onclick="event.stopPropagation(); toggleFile(this);">`;
            html += `<span class="case-id">${escapeHtml(shortId)}</span>`;
            html += `</div>`;
            html += `<div class="case-title" title="${escapeAttr(title)}">${escapeHtml(title)}</div>`;
            html += `<div class="case-meta">${pills.join('')}</div>`;
            html += `</div>`;
          }
          html += `</div></div>`; // /tree-l3 body + node
        }
        html += `</div></div>`; // /tree-l2 body + node
      }
      html += `</div></div>`; // /tree-l1 body + node
    }
    html += `</div></div>`; // /tree-l0 (year) body + node
  }

  // ─── 풍부 메타 없는 파일들 (fallback: 디렉토리만 표시) ───
  for (const [dir, files] of noMeta.entries()) {
    const l1Key = treeNodeKey('d', dir);
    const l1Collapsed = !searching && state[l1Key] === false;
    html += `<div class="tree-node tree-l1${l1Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l1Key)}">`;
    html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l1Key)}">`;
    html += `<input type="checkbox" class="dir-checkbox" data-dir="${escapeAttr(dir)}" onclick="event.stopPropagation(); toggleDirSelection('${escapeAttr(dir)}', this.checked);">`;
    html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displayDir(dir))}</span>`;
    html += `<span class="tree-count">${files.length}</span></div>`;
    html += `<div class="tree-body">`;
    for (const item of files) {
      const checked = selectedFiles.has(item.path) ? ' checked' : '';
      const active = (currentPath === item.path) ? ' active' : '';
      html += `<div class="case-item${active}" data-path="${escapeAttr(item.path)}">`;
      html += `<div class="case-item-row">`;
      html += `<input type="checkbox" data-path="${escapeAttr(item.path)}"${checked} onclick="event.stopPropagation(); toggleFile(this);">`;
      html += `<span class="case-title">${escapeHtml(displayFile(item.filename))}</span>`;
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }

  tree.innerHTML = html;

  // 트리 toggle 이벤트
  tree.querySelectorAll('.tree-header[data-tree-toggle]').forEach(h => {
    h.addEventListener('click', (ev) => {
      // 체크박스 클릭은 무시
      if (ev.target.tagName === 'INPUT') return;
      const node = h.closest('.tree-node');
      if (!node) return;
      node.classList.toggle('collapsed');
      const key = h.dataset.treeToggle;
      const s = loadTreeState();
      if (node.classList.contains('collapsed')) s[key] = node.classList.contains('tree-l3') ? false : false;
      else s[key] = node.classList.contains('tree-l3') ? true : true;
      saveTreeState(s);
      ev.stopPropagation();
    });
  });

  // Case 클릭 → 파일 로드 (단, ★ 북마크 클릭은 토글)
  tree.querySelectorAll('.case-item').forEach(item => {
    item.addEventListener('click', (ev) => {
      if (ev.target && ev.target.dataset && ev.target.dataset.bookmarkToggle) {
        ev.stopPropagation();
        toggleBookmark(ev.target.dataset.bookmarkToggle);
        return;
      }
      if (ev.target.tagName === 'INPUT') return;
      const path = item.dataset.path;
      if (path) loadFileByPath(path);
    });
  });

  updateSelectedCount();
  updateDirCheckboxStates();
}

// ─────────── 북마크 (localStorage 기반 — DB 없음) ───────────
const BOOKMARK_KEY = 'lawear_merge_bookmarks';
function loadBookmarks() {
  try { return new Set(JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '[]')); }
  catch (e) { return new Set(); }
}
function saveBookmarks(set) {
  try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(Array.from(set))); }
  catch (e) { /* ignore */ }
}
function isBookmarked(path) {
  if (!window.__bookmarks) window.__bookmarks = loadBookmarks();
  return window.__bookmarks.has(path);
}
function toggleBookmark(path) {
  if (!window.__bookmarks) window.__bookmarks = loadBookmarks();
  if (window.__bookmarks.has(path)) window.__bookmarks.delete(path);
  else window.__bookmarks.add(path);
  saveBookmarks(window.__bookmarks);
  renderTree(document.getElementById('search').value);
}

// ─────────── 필터 (17896 정본: all/err/stale/book) ───────────
let CURRENT_FILTER = 'all';
function filterMatch(meta, path) {
  if (CURRENT_FILTER === 'all') return true;
  if (CURRENT_FILTER === 'book') return isBookmarked(path);
  // err / stale: 데이터 없음 → 항상 빈 결과
  if (CURRENT_FILTER === 'err' || CURRENT_FILTER === 'stale') return false;
  return true;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

// ─────────── 체크박스 선택 ───────────
function toggleFile(cb) {
  const path = cb.dataset.path;
  if (cb.checked) selectedFiles.add(path);
  else selectedFiles.delete(path);
  updateSelectedCount();
  updateDirCheckboxStates();
}

function toggleSubjectSelection(sk, checked) {
  for (const [path, meta] of Object.entries(fileMetadata)) {
    if (meta.subjectKor === sk) {
      if (checked) selectedFiles.add(path);
      else selectedFiles.delete(path);
    }
  }

function updateDirCheckboxStates() {
  // Subject
  document.querySelectorAll('.dir-checkbox[data-subject]').forEach(cb => {
    const sk = cb.dataset.subject;
    let total = 0, sel = 0;
    for (const [path, meta] of Object.entries(fileMetadata)) {
      if (meta.subjectKor === sk) { total++; if (selectedFiles.has(path)) sel++; }
    }
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === total) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
  // Category
  document.querySelectorAll('.dir-checkbox[data-cat]').forEach(cb => {
    const [sk, cat] = cb.dataset.cat.split('|');
    let total = 0, sel = 0;
    for (const [path, meta] of Object.entries(fileMetadata)) {
      if (meta.subjectKor === sk && meta.category === cat) { total++; if (selectedFiles.has(path)) sel++; }
    }
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === total) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
  // File
  document.querySelectorAll('.dir-checkbox[data-file]').forEach(cb => {
    const [sk, cat, fc] = cb.dataset.file.split('|');
    let total = 0, sel = 0;
    for (const [path, meta] of Object.entries(fileMetadata)) {
      if (meta.subjectKor === sk && meta.category === cat && meta.file === fc) { total++; if (selectedFiles.has(path)) sel++; }
    }
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === total) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
  // Dir (fallback)
  document.querySelectorAll('.dir-checkbox[data-dir]').forEach(cb => {
    const dir = cb.dataset.dir;
    const files = fileIndex[dir] || [];
    const sel = files.filter(f => selectedFiles.has(`${dir}/${f}`)).length;
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === files.length) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
}

// ─── 라이브러리(두문자) 업로드 핸들러 ───
function bindLibraryUpload() {
  const bar = document.querySelector('.library-upload-bar');
  if (!bar) return;
  const triggerBtn = bar.querySelector('[data-upload-trigger]');
  const key = triggerBtn && triggerBtn.getAttribute('data-upload-trigger');
  if (!key) return;
  const fileInput = document.getElementById(`lib-upload-${key}`);
  const statusEl = document.getElementById(`lib-upload-status-${key}`);
  const targetPath = bar.getAttribute('data-upload-path') || '';
  const subject = bar.getAttribute('data-upload-subject') || '';
  if (!fileInput) return;

  triggerBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!targetPath || !targetPath.endsWith('.md')) {
      statusEl.className = 'lib-upload-status err';
      statusEl.textContent = '저장 경로 오류 (.md 아님)';
      return;
    }
    triggerBtn.disabled = true;
    statusEl.className = 'lib-upload-status pending';
    statusEl.textContent = 'Staging 업로드 중…';
    try {
      const content = await file.text();
      // Staging endpoint (뷰어 즉시 갱신 X — AI가 분석/머지 후 최종 저장)
      const resp = await fetch(`/api/staging/upload/${encodeURIComponent(subject)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'text/plain; charset=utf-8' },
        body: content
      });
      if (!resp.ok) {
        const errTxt = await resp.text().catch(() => '');
        throw new Error(`HTTP ${resp.status}${errTxt ? ' — ' + errTxt.slice(0, 80) : ''}`);
      }
      const result = await resp.json();
      statusEl.className = 'lib-upload-status ok';
      statusEl.textContent = `Staging 저장 완료 (${result.bytes} bytes, ${result.staged}). ${result.next_step}`;
      // 뷰어 자동 새로고침 X — 사용자가 AI 발화 후 최종 머지 시점에 갱신
    } catch (err) {
      statusEl.className = 'lib-upload-status err';
      statusEl.textContent = `실패: ${err.message || err}`;
      triggerBtn.disabled = false;
    } finally {
      // 동일 파일 재업로드 가능하도록 input 리셋
      fileInput.value = '';
    }
  });
}

  // ─── user_input 분기 (lawear-7ad6 design.md §1 + §5 + §6) ───

      ? `${displaySubject(meta.subjectKor)} · ${displayCategory(meta.category)}${meta.points ? ' · ' + meta.points + ' pt' : ''}`
      : `${meta.subjectKor} · ${meta.category} · ${meta.title || ''}${meta.points ? ' · ' + meta.points + '점' : ''}${meta.userCase ? ' · User#' + meta.userCase : ''}`;
    // 연도 추출 (id 첫 4자리). 없으면 빈 문자열로 생략
    const yearPart = (meta.id && /^\d{4}_/.test(meta.id)) ? meta.id.slice(0, 4) : '';
    const fileLabelClean = displayFileKor(meta.fileKor, meta.file)
      .replace(meta.subjectKor + '_', '')
      .replace(meta.category + '_', '');
    const pathParts = [
      yearPart,
      displaySubject(meta.subjectKor),
      displayCategory(meta.category),
      fileLabelClean,
      `Case ${meta.case}`,
    ].filter(Boolean).map(escapeHtml);
    const pathHtml = pathParts.join('<span class="crumb-sep">/</span>');
    headerHtml = `<div class="page-header">
      <span class="case-id-large">${escapeHtml(shortId)}</span>
      <span class="case-subject">${escapeHtml(subjLine)}</span>
      <div class="breadcrumb"><span class="case-path-text" id="case-path-label">${pathHtml}</span><label class="bookmark-checkbox" for="page-bookmark-cb-2" title="북마크 (체크=북마크 / 언체크=해제)"><input type="checkbox" id="page-bookmark-cb-2" data-bookmark-page="case" ${isBookmarked(currentPath) ? 'checked' : ''}><span class="bookmark-label">북마크</span></label><button type="button" class="btn-copy-path" id="copy-path-btn" title="경로 복사">복사</button></div>
    </div>`;
  }

  // lawear-6be6 2026-05-28: 민법/민소 3컬럼 분기 (옵션 A)
  //   좌 = ## 원본 (기본 hide — 사용자 토글 ON 시 표시)
  //   중 = ## Lv.1 빠른복습
  //   우 = ## Lv.4 암기노트
  //   기타 (기출문제/특수 등 — meta 있어도 subjectKor 미매칭, meta 없음) 는 기존 collapse UI 유지.
  const md = fullContent;
  const _sk2 = (meta && meta.subjectKor) || '';
  const isMinFamily = (_sk2 === '민법' || _sk2 === '민소');
  if (isMinFamily) {
    const originalMd = extractSection(md, '원본');
    const lv1Md = extractSection(md, 'Lv.1 빠른복습');
    const lv4Md = extractSection(md, 'Lv.4 암기노트');
    // 원본 헤더는 ## 원본 (NN점) 형식 — 이미 점수 포함이므로 별도 pointsTag 부착 X
    const originalHeader = extractSectionHeader(md, '원본') || '원본';
    // 상단 sticky: 전체 펼침/접힘 + 컬럼 토글 (좌 OFF default)
    let stickyHtml = '<div class="lv-tabs">';
    stickyHtml += `<div class="lv-tab expand-all-btn" onclick="expandAllCols()">전체 펼침</div>`;
    stickyHtml += `<div class="lv-tab collapse-all-btn" onclick="collapseAllCols()">전체 접힘</div>`;
    stickyHtml += '</div>';
    stickyHtml += '<div class="col-toggles">';
    stickyHtml += `<span class="col-toggle-label">컬럼</span>`;
    // 좌 = 원본 — 기본 OFF (사용자: "원본은 평소 안 봄, 필요할 때만 클릭")
    stickyHtml += `<label class="col-toggle" data-col-target="left"><input type="checkbox" onchange="toggleCol('left', this.checked)"><span>원본</span></label>`;
    stickyHtml += `<label class="col-toggle active" data-col-target="mid"><input type="checkbox" checked onchange="toggleCol('mid', this.checked)"><span>Lv.1 빠른복습</span></label>`;
    stickyHtml += `<label class="col-toggle active" data-col-target="right"><input type="checkbox" checked onchange="toggleCol('right', this.checked)"><span>Lv.4 암기노트</span></label>`;
    stickyHtml += '</div>';
    // 그리드 본체 (3컬럼, 좌 hidden 클래스 default)
    let gridHtml = `<div class="tab-cols" id="tab-cols-root">`;
    gridHtml += `<section class="tab-col hidden" data-col="left"><div class="tab-col-header">${escapeHtml(originalHeader)}</div><div class="tab-col-body">${renderMd(originalMd || '(원본 섹션 없음)')}</div></section>`;
    gridHtml += `<section class="tab-col" data-col="mid"><div class="tab-col-header">Lv.1 빠른복습</div><div class="tab-col-body">${wrapLvToc(renderMd(lv1Md || '(Lv.1 빠른복습 없음)'))}</div></section>`;
    gridHtml += `<section class="tab-col" data-col="right"><div class="tab-col-header">Lv.4 암기노트</div><div class="tab-col-body">${wrapLvToc(renderMd(lv4Md || '(Lv.4 암기노트 없음)'))}</div></section>`;
    gridHtml += '</div>';
    content.innerHTML = headerHtml + stickyHtml + '<div id="mdContent">' + gridHtml + '</div>';
    if (editorWrap) content.appendChild(editorWrap);
    // 초기 컬럼 수 동기화 (좌 hidden default → cols-2 클래스 부여, 1개만 보이면 cols-1)
    updateColGridClass();
    return;
  }
  // 그 외 (기출문제/특수/메타 없는 케이스) — 기존 collapse UI 유지
  const all_sections = extractAllH2Sections(md);
  let tabs = '<div class="lv-tabs">';
  tabs += `<div class="lv-tab expand-all-btn" onclick="expandAllSections()">모두 펼침</div>`;
  tabs += `<div class="lv-tab collapse-all-btn" onclick="collapseAllSections()">모두 접힘</div>`;
  for (const s of all_sections) {
    const dataAttr = escapeAttr(s.name);
    const escName = escapeHtml(s.name);
    tabs += `<div class="lv-tab" data-section-badge="${dataAttr}" onclick='toggleSection(${JSON.stringify(s.name)}, event)'>${escName}</div>`;
  }
  tabs += '</div>';
  content.innerHTML = headerHtml + tabs + '<div id="mdContent"></div>';
  if (editorWrap) content.appendChild(editorWrap);
  renderCollapsibleSections(document.getElementById('mdContent'), md);
}

function showSection(section, event) {
  document.querySelectorAll('.lv-tab').forEach(t => t.classList.remove('active'));
  if (event) event.target.classList.add('active');
  else {
    document.querySelectorAll('.lv-tab').forEach(t => { if (t.dataset.key === section) t.classList.add('active'); });
  }

  const md = fullContent;
  const target = document.getElementById('mdContent');

  // lawear-18eb 2026-05-25: user_input 분기 (탭 [문제/목차/답안/전체])
  // lawear-6be6 2026-05-28: 부등법 Lv.4 자유노트 컬럼 (빈 시 숨김, 본문 있을 때 cols-3)
  const ui_meta = fileMetadata[currentPath];
  if (ui_meta && ui_meta.type === 'user_input') {
    const problemMd = extractSection(md, '문제');
    const answerMd = extractSection(md, '답안');
    const tocMd = extractSection(md, '목차');
    const memoMd = extractSection(md, '메모');
    const lv4FreeMd = extractSection(md, 'Lv.4 자유노트');
    const hasLv4Free = !!(lv4FreeMd && lv4FreeMd.trim().length > 0);
    const pointsTag = ui_meta.points ? ` (${ui_meta.points}점)` : '';
    const tocHtml = tocMd ? `<div class="user-toc"><span class="toc-label">목차</span>${renderMd(tocMd)}</div>` : '';
    const memoHtml = memoMd ? `<div class="user-memo"><span class="memo-label">메모</span>${renderMd(memoMd)}</div>` : '';
    if (section === '전체') {
      if (hasLv4Free) {
        // 3컬럼 (문제 / 답안 / Lv.4 자유노트) — 사용자가 Lv.4 자유노트에 입력한 경우만
        target.innerHTML = `<table class="compare-table cols-3">
          <thead><tr><th>문제${pointsTag}</th><th>답안${pointsTag}</th><th>Lv.4 자유노트</th></tr></thead>
          <tbody><tr>
            <td>${renderMd(problemMd || '(문제 없음)')}</td>
            <td>${tocHtml}${renderMd(answerMd || '(답안 없음)')}</td>
            <td>${renderMd(lv4FreeMd)}</td>
          </tr></tbody>
        </table>` + memoHtml;
      } else {
        // 2컬럼 (문제 / 답안) — Lv.4 자유노트 빈 시 기존 폭 유지
        target.innerHTML = `<table class="compare-table cols-2">
          <thead><tr><th>문제${pointsTag}</th><th>답안${pointsTag}</th></tr></thead>
          <tbody><tr>
            <td>${renderMd(problemMd || '(문제 없음)')}</td>
            <td>${tocHtml}${renderMd(answerMd || '(답안 없음)')}</td>
          </tr></tbody>
        </table>` + memoHtml;
      }
    } else if (section === '문제') {
      target.innerHTML = renderMd(problemMd || '<p style="color:#888;">(문제 없음)</p>') + memoHtml;
    } else if (section === '답안') {
      target.innerHTML = tocHtml + renderMd(answerMd || '<p style="color:#888;">(답안 없음)</p>') + memoHtml;
    } else if (section === '목차') {
      target.innerHTML = (tocMd ? renderMd(tocMd) : '<p style="color:#888;">(목차 섹션 없음)</p>') + memoHtml;
    } else if (section === 'Lv.4') {
      // 부등법 Lv.4 자유노트 탭 (탭 클릭 시 자유노트만 표시)
      target.innerHTML = (hasLv4Free
        ? renderMd(lv4FreeMd)
        : '<p style="color:#888;">(Lv.4 자유노트 비어있음 — .md 파일에 직접 입력하세요)</p>') + memoHtml;
    }
    return;
  }

  if (section === '전체') {
    const original = extractSection(md, '원본');
    const lv1 = extractSection(md, 'Lv.1 빠른복습');
    const lv4 = extractSection(md, 'Lv.4 암기노트');
    const k = stealthMode ? 'fake' : 'real';
    const labels = stealthUI.tabs[k];
    const originalLabel = stealthMode ? labels[0] : extractSectionHeader(md, '원본');
    target.innerHTML = `
      <table class="compare-table">
        <thead><tr><th>${originalLabel}</th><th>Lv.1</th><th>Lv.4</th></tr></thead>
        <tbody><tr>
          <td>${renderMd(original || '(없음)')}</td>
          <td>${wrapLvToc(renderMd(lv1 || '(없음)'))}</td>
          <td>${wrapLvToc(renderMd(lv4 || '(없음)'))}</td>
        </tr></tbody>
      </table>
    `;
    return;
  }

  let sectionKey, sectionHeader;
  if (section === '원본') { sectionKey = '원본'; sectionHeader = stealthMode ? '원본' : extractSectionHeader(md, '원본'); }
  else if (section === 'Lv.1') { sectionKey = 'Lv.1 빠른복습'; sectionHeader = 'Lv.1 빠른복습'; }
  else if (section === 'Lv.4') { sectionKey = 'Lv.4 암기노트'; sectionHeader = 'Lv.4 암기노트'; }

  const c = extractSection(md, sectionKey);
  target.innerHTML = c ? wrapLvToc(renderMd(`## ${sectionHeader}\n\n${c}`)) : '<p style="color:#484f58;">해당 섹션을 찾을 수 없습니다.</p>';
}

// lawear-6be6 2026-05-28: 접펼 섹션 UI 공통 함수.
//   모든 ## H2 헤더 추출 → details/summary 렌더 (디폴트 모두 접힘).
//   메타 섹션은 제외. 임의 H2 추가 (예: ## 내메모) 자동 접펼 영역.
function extractAllH2Sections(md) {
  // JS regex \Z 미지원 — line-by-line parse로 마지막 H2 섹션 매칭 보장 (lawear-6be6 2026-05-28 fix)
  const lines = md.split('\n');
  const result = [];
  let curName = null;
  let curBody = [];
  for (const ln of lines) {
    const m = ln.match(/^## (.+?)\s*$/);
    if (m) {
      // 이전 섹션 flush
      if (curName !== null && curName !== '메타') {
        result.push({ name: curName, body: curBody.join('\n').trim() });
      }
      curName = m[1].trim();
      curBody = [];
    } else if (curName !== null) {
      curBody.push(ln);
    }
  }
  // 마지막 섹션 flush (## test 같은 끝 섹션 누락 방지)
  if (curName !== null && curName !== '메타') {
    result.push({ name: curName, body: curBody.join('\n').trim() });
  }
  return result;
}
function renderCollapsibleSections(targetEl, md, opts) {
  opts = opts || {};
  const sections = extractAllH2Sections(md);
  if (sections.length === 0) {
    targetEl.innerHTML = '<p style="color:#888;">(섹션 없음 — ## 헤더 1개 이상 필요)</p>';
    return;
  }
  let html = '';
  for (const s of sections) {
    const dataAttr = escapeAttr(s.name);
    const label = escapeHtml(s.name);
    // 부등법 ## 목차 같은 짧은 본문은 user-toc 박스로 wrap (lv1/lv4와 별개)
    const bodyHtml = renderMd(s.body || '(비어있음)');
    html += `<details class="section-collapse" data-section="${dataAttr}">
      <summary class="section-summary">${label}</summary>
      <div class="section-body">${bodyHtml}</div>
    </details>`;
  }
  targetEl.innerHTML = html;
}
function expandAllSections() {
  document.querySelectorAll('details.section-collapse').forEach(d => d.open = true);
  document.querySelectorAll('.lv-tab[data-section-badge]').forEach(t => t.classList.add('active'));
}
function collapseAllSections() {
  document.querySelectorAll('details.section-collapse').forEach(d => d.open = false);
  document.querySelectorAll('.lv-tab[data-section-badge]').forEach(t => t.classList.remove('active'));
}
function toggleSection(name, event) {
  const sel = `details.section-collapse[data-section="${CSS.escape(name)}"]`;
  const d = document.querySelector(sel);
  if (!d) return;
  d.open = !d.open;
  if (event) {
    const tab = event.target.closest('.lv-tab');
    if (tab) tab.classList.toggle('active', d.open);
    d.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

// lawear-6be6 2026-05-28: 옵션 A — 3컬럼/2컬럼 grid 토글 헬퍼.
//   .tab-col[data-col="left|mid|right"] 의 .hidden 클래스 + .col-toggles label.active 동기화.
//   그리드 컬럼 수는 updateColGridClass() 가 자동 조정 (3→2→1).
function toggleCol(colName, on) {
  const col = document.querySelector(`.tab-col[data-col="${colName}"]`);
  if (col) col.classList.toggle('hidden', !on);
  const lab = document.querySelector(`.col-toggles label.col-toggle[data-col-target="${colName}"]`);
  if (lab) lab.classList.toggle('active', !!on);
  updateColGridClass();
}
function expandAllCols() {
  document.querySelectorAll('.col-toggles label.col-toggle').forEach(lab => {
    const cb = lab.querySelector('input[type="checkbox"]');
    if (cb && !cb.checked) {
      cb.checked = true;
      const target = lab.dataset.colTarget;
      const col = document.querySelector(`.tab-col[data-col="${target}"]`);
      if (col) col.classList.remove('hidden');
      lab.classList.add('active');
    } else {
      lab.classList.add('active');
    }
  });
  updateColGridClass();
}
function collapseAllCols() {
  document.querySelectorAll('.col-toggles label.col-toggle').forEach(lab => {
    const cb = lab.querySelector('input[type="checkbox"]');
    if (cb && cb.checked) {
      cb.checked = false;
      const target = lab.dataset.colTarget;
      const col = document.querySelector(`.tab-col[data-col="${target}"]`);
      if (col) col.classList.add('hidden');
      lab.classList.remove('active');
    } else {
      lab.classList.remove('active');
    }
  });
  updateColGridClass();
}
function updateColGridClass() {
  // 보이는 컬럼 개수에 따라 grid-template-columns 자동 조정 (3 / 2 / 1)
  const root = document.getElementById('tab-cols-root');
  if (!root) return;
  const visible = root.querySelectorAll('.tab-col:not(.hidden)').length;
  root.classList.remove('cols-2', 'cols-1');
  if (visible === 2) root.classList.add('cols-2');
  else if (visible <= 1) root.classList.add('cols-1');
}

function wrapLvToc(html) {
  // Lv.1/Lv.4 안 ### 목차 → user-toc 박스 (부등법 ## 목차와 동일 스타일, lawear-18eb)
  return html.replace(/<h3[^>]*>\s*목차\s*<\/h3>\s*(<ol[\s\S]*?<\/ol>)/, '<div class="user-toc"><span class="toc-label">목차</span>$1</div>');
}

function extractSection(md, sectionName) {
  const lines = md.split('\n');
  let capture = false;
  let result = [];
  for (const line of lines) {
    if (line.startsWith('## ') && line.includes(sectionName)) { capture = true; continue; }
    if (capture && line.startsWith('## ')) break;
    if (capture) result.push(line);
  }
  return result.join('\n').trim();
}

// 분설 메타 파서 (lawear-6be6 2026-05-28) — ## 메타 YAML 본문에서 _분설_* 라인 추출
//  - 입력: metaSection (extractSection(md, '메타') 결과)
//  - 출력: { count: N, labels: [...], summaries: { 라벨: 요약 } } 또는 null
//  - 분설 메타 없는 (_분설_count 부재) 단일 .md = null 반환 → UI 영향 X
function parseBunseolMeta(metaSection) {
  if (!metaSection) return null;
  const m = metaSection.match(/_분설_count:\s*(\d+)/);
  if (!m) return null;
  const count = parseInt(m[1], 10);
  let labels = [];
  const labelsM = metaSection.match(/_분설_라벨:\s*(\[[^\]]+\])/);
  if (labelsM) {
    try { labels = JSON.parse(labelsM[1]); }
    catch (e) { labels = []; }
  }
  const summaries = {};
  for (const label of labels) {
    const key = label.replace(/\s+/g, '_');
    // _분설_{key}_요약: "..." — 라벨에 공백/한글 OK (key는 _로 정규화)
    const escKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    let sM = metaSection.match(new RegExp('_분설_' + escKey + '_요약:\\s*"([^"]+)"'));
    if (!sM) {
      // Fallback (lawear-da75 2026-05-28): 라벨에 괄호(상세 설명) 포함 시 메타 키는 simplified 패턴 빈출
      //   "객체 1 (농협통장)" 라벨 → 메타 키 "객체_1" 형태 (괄호 부분 제거)
      const simpleKey = label.replace(/\s*\([^)]*\)\s*/g, '').replace(/\s+/g, '_').trim().replace(/^_|_$/g, '');
      if (simpleKey && simpleKey !== key) {
        const simpleEsc = simpleKey.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        sM = metaSection.match(new RegExp('_분설_' + simpleEsc + '_요약:\\s*"([^"]+)"'));
      }
    }
    if (sM) summaries[label] = sM[1];
  }
  return { count, labels, summaries };
}

// 분설 박스 HTML 렌더 (lawear-6be6 2026-05-28)
//  - 입력: bunseol = { count, labels, summaries } (parseBunseolMeta 결과)
//  - 출력: <div class="bunseol-box">...</div> HTML 문자열
//  - 라벨만 있고 요약 없는 경우도 라벨만 표시
function renderBunseolBox(bunseol) {
  if (!bunseol || !bunseol.count) return '';
  const items = (bunseol.labels || []).map(label => {
    const summary = bunseol.summaries[label];
    const labelEsc = escapeHtml(label);
    if (summary) {
      return `<li><span class="bunseol-label">${labelEsc}:</span><span class="bunseol-summary">${escapeHtml(summary)}</span></li>`;
    }
    return `<li><span class="bunseol-label">${labelEsc}</span></li>`;
  }).join('');
  return `<div class="bunseol-box"><span class="bunseol-title">📋 분설 ${bunseol.count}개</span><ul>${items}</ul></div>`;
}

function extractSectionHeader(md, sectionName) {
  for (const line of md.split('\n')) {
    if (line.startsWith('## ') && line.includes(sectionName)) {
      return line.replace(/^##\s+/, '').trim();
    }
  }
  return sectionName;
}

function parseSubsections(section) {
  const result = {};
  const lines = section.split('\n');
  let current = null;
  let buffer = [];
  for (const line of lines) {
    const m = line.match(/^###\s+(.+)$/);
    if (m) {
      if (current) result[current] = buffer.join('\n').trim();
      current = m[1].trim();
      buffer = [];
    } else if (current) buffer.push(line);
  }
  if (current) result[current] = buffer.join('\n').trim();
  return result;
}

function stripEmphasis(text) {
  return text
    .replace(/\[red\]([\s\S]+?)\[\/red\]/g, '$1')
    .replace(/\[blue\]([\s\S]+?)\[\/blue\]/g, '$1')
    .replace(/\[purple\]([\s\S]+?)\[\/purple\]/g, '$1')
    .replace(/\[violet\]([\s\S]+?)\[\/violet\]/g, '$1')
    .replace(/\[magenta\]([\s\S]+?)\[\/magenta\]/g, '$1')
    .replace(/\[indigo\]([\s\S]+?)\[\/indigo\]/g, '$1')
    .replace(/\[bold\]([\s\S]+?)\[\/bold\]/g, '$1')
    .replace(/\[u\]([\s\S]+?)\[\/u\]/g, '$1')
    .replace(/\[blank2\]([\s\S]+?)\[\/blank2\]/g, '$1')
    .replace(/\[blank\]([\s\S]+?)\[\/blank\]/g, '$1')
    .replace(/\[em1\]([\s\S]+?)\[\/em1\]/g, '$1')
    .replace(/\[em2\]([\s\S]+?)\[\/em2\]/g, '$1')
    .replace(/\[em3\]([\s\S]+?)\[\/em3\]/g, '$1')
    .replace(/\[em4\]([\s\S]+?)\[\/em4\]/g, '$1')
    // lawear-7ea2 (2026-05-26): 부등법 d1~d4(뎁스) + hl1~hl4(강조) 다운로드 시 strip (TTS 노이즈 방지)
    .replace(/\[d1\]([\s\S]+?)\[\/d1\]/g, '$1')
    .replace(/\[d2\]([\s\S]+?)\[\/d2\]/g, '$1')
    .replace(/\[d3\]([\s\S]+?)\[\/d3\]/g, '$1')
    .replace(/\[d4\]([\s\S]+?)\[\/d4\]/g, '$1')
    .replace(/\[hl1\]([\s\S]+?)\[\/hl1\]/g, '$1')
    .replace(/\[hl2\]([\s\S]+?)\[\/hl2\]/g, '$1')
    .replace(/\[hl3\]([\s\S]+?)\[\/hl3\]/g, '$1')
    .replace(/\[hl4\]([\s\S]+?)\[\/hl4\]/g, '$1')
    .replace(/\[con\]([\s\S]+?)\[\/con\]/g, '$1')
    .replace(/\[fact\]([\s\S]+?)\[\/fact\]/g, '$1')
    .replace(/\[case\]([\s\S]+?)\[\/case\]/g, '$1')
    .replace(/\[bridge\]([\s\S]+?)\[\/bridge\]/g, '$1')
    .replace(/\[key\]([\s\S]+?)\[\/key\]/g, '$1')
    .replace(/\[free1\]([\s\S]+?)\[\/free1\]/g, '$1')
    .replace(/\[free2\]([\s\S]+?)\[\/free2\]/g, '$1')
    // lawear-4b59 (2026-05-21): 라이브러리 출처 inline 표기 제거 (TTS 다운로드 시 노이즈 방지)
    // 패턴: (라이브러리 N-N) 또는 (라이브러리 미수록 — ...) 등
    .replace(/\s*\(라이브러리[^)]*\)\s*/g, ' ')
    .replace(/  +/g, ' ');
}

function extractCaseNum(filename) {
  const m = filename.match(/미케(\d+)_(\d+)/);
  if (m) return `${parseInt(m[1], 10)}-${parseInt(m[2], 10)}`;
  const m2 = filename.match(/모고(\d+)_(\d+)/);
  if (m2) return `모고${parseInt(m2[1], 10)}-${parseInt(m2[2], 10)}`;
  return filename.replace('.md', '');
}

function isAnswerHeader(line) {
  const t = line.trim();
  return /^\d+\.\s+\S/.test(t) || /^\(\d+\)\s+\S/.test(t) || /^\d+\)\s+\S/.test(t);
}

function formatOriginalMerge(md, caseNum) {
  const section = stripEmphasis(extractSection(md, '원본'));
  const cleaned = section.split('\n').filter(l => !/^###\s+/.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  return `Case ${caseNum}.\n${cleaned}`;
}

function formatLv1Merge(md, caseNum) {
  const section = stripEmphasis(extractSection(md, 'Lv.1 빠른복습'));
  const sub = parseSubsections(section);
  let problem = (sub['문제'] || '').trim();
  const tocRaw = (sub['목차'] || '').trim();
  const answerRaw = (sub['답안'] || '').trim();
  if (problem.endsWith('.')) problem = problem.slice(0, -1) + '?';
  const tocItems = [];
  tocRaw.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    let item = t.replace(/^\d+\.\s*/, '').replace(/^\(\d+\)\s*/, '').replace(/^\d+\)\s*/, '');
    if (!item) return;
    if (/^(결론|이유|사안의?\s*경우)$/.test(item)) return;
    tocItems.push(item);
  });
  const tocText = tocItems.map((it, i) => `목차 ${i+1}번, ${it},`).join('\n');
  const answerLines = answerRaw.split('\n').map(line => isAnswerHeader(line) ? '' : line);
  const compact = [];
  for (const line of answerLines) {
    if (line === '' && compact[compact.length-1] === '') continue;
    compact.push(line);
  }
  while (compact[0] === '') compact.shift();
  while (compact[compact.length-1] === '') compact.pop();
  return `Case ${caseNum}.\n${problem}\n${tocText}\n${compact.join('\n')}`;
}

function formatLv4Merge(md, caseNum) {
  const section = stripEmphasis(extractSection(md, 'Lv.4 암기노트'));
  const lines = section.split('\n').filter(l => l.trim());
  if (lines.length === 0) return `Case ${caseNum}. (Lv.4 없음)`;
  return `Case ${caseNum}. ${lines[0]}\n${lines.slice(1).join('\n')}`;
}

// lawear-da75 (2026-05-28) — 답안 단독 머지 (사용자 P1 회귀 보고 대응)
//   모범답안 우선, 없으면 답안 fallback. stripEmphasis + ### 헤더 제거 + 3+ 줄바꿈 정리.
function formatAnswerMerge(md, caseNum) {
  const raw = extractSection(md, '모범답안') || extractSection(md, '답안');
  const section = stripEmphasis(raw);
  const cleaned = section.split('\n').filter(l => !/^###\s+/.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  if (!cleaned) return `Case ${caseNum}. (답안 없음)`;
  return `Case ${caseNum}.\n${cleaned}`;
}

function openDownloadModal() {
  if (selectedFiles.size === 0) { alert('파일을 1개 이상 체크하세요'); return; }
  // lawear-7ad6 v5 — user_input 전용: 원본/Lv.1/Lv.4 구분 없음 → modal skip + 바로 다운로드
  const allUserInput = Array.from(selectedFiles).every(p => {
    const meta = fileMetadata[p];
    return meta && meta.type === 'user_input';
  });
  if (allUserInput) {
    doDownload({ skipModal: true });
    return;
  }
  document.getElementById('modal-info').textContent = `${selectedFiles.size}개 파일 머지`;
  document.getElementById('download-modal').classList.add('show');
}
function closeModal() { document.getElementById('download-modal').classList.remove('show'); }

async function doDownload(opts) {
  const skipModal = opts && opts.skipModal;
  const level = skipModal ? null : document.querySelector('input[name="merge-level"]:checked').value;
  const files = Array.from(selectedFiles).sort();
  const parts = [];
  for (const filepath of files) {
    const slash = filepath.indexOf('/');
    const dir = filepath.slice(0, slash);
    const filename = filepath.slice(slash + 1);
    const res = await fetch(`${dir}/${filename}`);
    const md = await res.text();
    const caseNum = extractCaseNum(filename);
    const meta = fileMetadata[filepath];
    let merged;
    if (meta && meta.type === 'user_input') {
      // user_input: level 무시 — 문제/답안/메모만 (사용자 입력 모드 다운로드 룰)
      merged = formatUserInputMerge(md, meta);
    } else if (level === '원본') merged = formatOriginalMerge(md, caseNum);
    else if (level === 'Lv.1') merged = formatLv1Merge(md, caseNum);
    else if (level === '답안') merged = formatAnswerMerge(md, caseNum);
    else if (level === 'Lv.4') merged = formatLv4Merge(md, caseNum);
    else merged = formatOriginalMerge(md, caseNum);  // fallback
    parts.push(merged);
  }
  const blob = new Blob([parts.join('\n\n\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  const levelTag = skipModal ? 'userinput' : level.replace('.', '');
  a.download = `merged_${levelTag}_${selectedFiles.size}_${today}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  if (!skipModal) closeModal();
}

// lawear-7ad6 v5 — user_input 다운로드 포맷 (문제/답안/메모만, 원본/Lv 구분 없음)
//   다른 과목 formatOriginalMerge 등과 동일하게 강조 태그 제거 + 헤드라인 추가
function formatUserInputMerge(md, meta) {
  const problem = stripEmphasis(extractSection(md, '문제')).trim();
  const answer = stripEmphasis(extractSection(md, '답안')).trim();
  const memo = stripEmphasis(extractSection(md, '메모')).trim();
  const head = `[${meta.subjectKor || ''}] ${meta.category || ''} ${meta.file || ''} ${meta.title || ''}`.trim();
  let out = head + '\n\n[문제]\n' + (problem || '(빈)');
  out += '\n\n[답안]\n' + (answer || '(빈)');
  if (memo) out += '\n\n[메모]\n' + memo;
  return out;
}

// ─────────── 경로 복사 버튼 (event delegation — breadcrumb 재렌더 대응) ───────────
document.addEventListener('click', (ev) => {
  const btn = ev.target.closest('#copy-path-btn');
  if (!btn) return;
  ev.preventDefault();
  ev.stopPropagation();
  const labelEl = document.getElementById('case-path-label');
  // separator '<span class="crumb-sep">/</span>' → '/' (텍스트 추출 시 자동 변환됨)
  const text = labelEl ? labelEl.textContent.replace(/\s+/g, ' ').trim() : (currentPath || '');
  const onOk = () => {
    btn.classList.add('copied');
    const orig = btn.textContent;
    btn.textContent = '복사됨';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = orig;
    }, 1200);
  };
  const onFail = (e) => {
    console.warn('copy failed', e);
    btn.textContent = '실패';
    setTimeout(() => { btn.textContent = '복사'; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(onOk).catch(onFail);
  } else {
    // fallback: legacy execCommand
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      onOk();
    } catch (e) { onFail(e); }
  }
});

let editMode = false;
let originalContent = '';

function toggleEditor() {
  if (!editMode && !currentFile) {
    alert('파일을 먼저 선택하세요');
    return;
  }
  if (editMode) {
    const ta = document.getElementById('editor-textarea');
    if (ta && ta.value && ta.value !== originalContent) {
      if (!confirm('저장하지 않은 변경 사항이 있습니다. 버리시겠습니까?')) return;
    }
  }
  editMode = !editMode;
  document.body.classList.toggle('editing', editMode);
  document.getElementById('editor-toggle').classList.toggle('active', editMode);
  if (editMode) {
    originalContent = fullContent || '';
    document.getElementById('editor-textarea').value = originalContent;
    updateEditorPreview();
    setSaveStatus('', '');
  }
}

function updateEditorPreview() {
  const ta = document.getElementById('editor-textarea');
  const preview = document.getElementById('editor-preview');
  preview.innerHTML = renderMd(ta.value);
}

function wrapEmphasis(tag) {
  const ta = document.getElementById('editor-textarea');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  if (start === end) { setSaveStatus('텍스트를 먼저 선택하세요', 'error'); return; }
  const selected = ta.value.substring(start, end);
  const allTags = ['em1', 'em2', 'em3', 'em4', 'd1', 'd2', 'd3', 'd4', 'hl1', 'hl2', 'hl3', 'hl4', 'con', 'fact', 'case', 'bridge', 'key', 'free1', 'free2', 'red', 'blue', 'purple', 'violet', 'magenta', 'indigo', 'bold', 'u', 'blank2', 'blank'];
  let cleaned = selected;
  for (const t of allTags) {
    const re = new RegExp(`\\[${t}\\]([\\s\\S]+?)\\[\\/${t}\\]`, 'g');
    cleaned = cleaned.replace(re, '$1');
  }
  const wrapped = tag === 'clear' ? cleaned : `[${tag}]${cleaned}[/${tag}]`;
  ta.setRangeText(wrapped, start, end, 'select');
  ta.focus();
  updateEditorPreview();
  setSaveStatus(tag === 'clear' ? '강조 제거' : `[${tag}] 적용`, 'success');
}

async function saveFile() {
  if (!editMode) return;
  if (!currentPath) { setSaveStatus('파일이 선택되지 않음', 'error'); return; }
  const ta = document.getElementById('editor-textarea');
  const newContent = ta.value;
  if (newContent === originalContent) {
    setSaveStatus('변경 사항 없음', 'success');
    return;
  }
  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true;
  setSaveStatus('저장 중...', '');
  try {
    const res = await fetch(`/api/save/${encodeURI(currentPath)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: newContent
    });
    if (res.ok) {
      const data = await res.json();
      setSaveStatus(`✓ 저장 완료 (${data.bytes} bytes)`, 'success');
      originalContent = newContent;
      fullContent = newContent;
    } else {
      const errText = await res.text().catch(() => '');
      setSaveStatus(`✗ 저장 실패 (${res.status}): ${errText.slice(0, 80)}`, 'error');
    }
  } catch (e) {
    setSaveStatus(`✗ 네트워크 오류: ${e.message}`, 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

function setSaveStatus(msg, kind) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'save-status ' + (kind || '');
}

// ─────────── [case] 조문원문 마우스오버 툴팁 (lawear-18eb 2026-05-24) ───────────
// 17896 docs/tts-exam/index.html (9514~9572) 이식.
//   셀렉터 교체: getElementById('attempt-modal') → #content,  .inline-marker[data-comment] → .tts-case[data-comment]
//   body portal 패턴 (position fixed) — 답안/테이블 영역 무관하게 자유 위치 + 화면 가장자리 회피.
let __tooltipPortalEl = null;
function showInlineTooltip(marker) {
  const comment = marker.getAttribute('data-comment');
  if (!comment) return;
  if (!__tooltipPortalEl) {
    __tooltipPortalEl = document.createElement('div');
    __tooltipPortalEl.className = 'inline-tooltip-portal';
    document.body.appendChild(__tooltipPortalEl);
  }
  const tip = __tooltipPortalEl;
  tip.textContent = comment;
  tip.style.left = '0px';
  tip.style.top = '0px';
  tip.classList.add('show');
  // 위치 계산 — 마커 우측 옆 + 화면 가장자리 회피
  const mRect = marker.getBoundingClientRect();
  const tRect = tip.getBoundingClientRect();
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const PAD = 8;
  // 좌우: 마커 우측 + PAD. 화면 우측 넘으면 마커 좌측 옆.
  let left = mRect.right + PAD;
  if (left + tRect.width > vw - PAD) {
    left = mRect.left - tRect.width - PAD;
  }
  if (left < PAD) left = PAD;
  // 상하: 마커 상단 정렬. 화면 하단 넘으면 위로 조정.
  let top = mRect.top;
  if (top + tRect.height > vh - PAD) {
    top = vh - tRect.height - PAD;
  }
  if (top < PAD) top = PAD;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideInlineTooltip() {
  if (__tooltipPortalEl) __tooltipPortalEl.classList.remove('show');
}
function wireInlineMarkerTooltipDirection() {
  const root = document.getElementById('content');  // attempt-modal 없음 → 공통부모 #content
  if (!root || root.dataset.tooltipWired === '1') return;
  // lawear-7ea2 (2026-05-25): .tts-case-art[data-comment] (통문장 부분 wrap 신규) 도 호버 대상 추가.
  //   기존 .tts-case[data-comment] (normal_wrap 150개) 는 그대로 유지 — 호환.
  const TOOLTIP_SEL = '.tts-case[data-comment], .tts-case-art[data-comment]';
  root.addEventListener('mouseover', (ev) => {
    const marker = ev.target.closest(TOOLTIP_SEL);
    if (marker) showInlineTooltip(marker);
  }, true);
  root.addEventListener('mouseout', (ev) => {
    const marker = ev.target.closest(TOOLTIP_SEL);
    if (marker) hideInlineTooltip();
  }, true);
  root.dataset.tooltipWired = '1';
}
// 페이지 로드 후 1회 wire (#content는 정적 — 내부 innerHTML 교체돼도 이벤트 위임으로 동작).
(function initTooltipDirWire() {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', wireInlineMarkerTooltipDirection);
  } else {
    wireInlineMarkerTooltipDirection();
  }
})();
