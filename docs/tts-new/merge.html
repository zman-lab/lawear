<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">TTS 머지 뷰어 (17895)</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 17896 좌측 패널 톤 (Internal Review Console 정본) + merge.html 우측 톤 보존 */
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --panel-2: #2d2d30;
    --border: #3e3e42;
    --border-light: #464647;
    --text: #cccccc;
    --text-dim: #858585;
    --text-bright: #e8e8e8;
    --accent: #569cd6;
    --accent-dim: #4a7ba8;
    --success: #4ec9b0;
    --success-strong: #2ea043;
    --warn: #ce9178;
    --danger: #d16969;
    --link: #9cdcfe;
    --text-mute: #5a5a5a;
    --accent-strong: #569cd6;
    --success: #4ec9b0;
  }
  html, body { height: 100%; }
  body { font-family: -apple-system, 'Segoe UI', 'Pretendard', sans-serif; display: flex; background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; position: relative; }

  /* ─────────── Sidebar (17896 정본) ─────────── */
  #sidebar {
    width: 280px;
    min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: width 0.18s, min-width 0.18s, border-right 0.18s;
    overflow: hidden;
  }
  #sidebar.collapsed {
    width: 0;
    min-width: 0;
    border-right: none;
  }

  /* Sidebar 헤더 (Internal Review Console 톤) */
  .sidebar-header { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sidebar-header h2 {
    font-size: 12px; font-weight: 600;
    color: var(--text-bright);
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .sidebar-header h2 .sub { color: var(--text-dim); font-weight: 400; margin-left: 4px; }
  .stats { font-size: 10px; color: var(--text-dim); margin-top: 4px; font-family: 'SF Mono', Consolas, monospace; }

  /* filters: 17896 정본 */
  #sidebar .filters {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #sidebar .filter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    margin-bottom: 6px;
  }
  #sidebar .filter-row button {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 5px 6px;
    font-size: 11px;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
    text-align: left;
    padding-left: 8px;
  }
  #sidebar .filter-row button:hover { border-color: var(--accent-dim); color: var(--text); }
  #sidebar .filter-row button.active { background: var(--accent-dim); color: #fff; border-color: var(--accent); }
  #sidebar .search {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    font-size: 12px;
    border-radius: 3px;
    font-family: inherit;
  }
  #sidebar .search:focus { outline: none; border-color: var(--accent); }

  /* merge.html 전용 액션 (다운로드 / 펼치기 / 접기 / 선택카운트) — 17896 톤 적용 */
  .sidebar-actions { padding: 8px 10px 0; display: flex; gap: 4px; }
  .sidebar-actions button {
    flex: 1; padding: 5px 6px; font-size: 11px;
    background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 3px;
    cursor: pointer; font-family: inherit;
  }
  .sidebar-actions button:hover { background: var(--panel-2); border-color: var(--accent-dim); color: var(--text); }
  .sidebar-actions button.primary { background: var(--accent-dim); color: #fff; border-color: var(--accent); }
  .sidebar-actions button.primary:hover { background: var(--accent); }
  .selected-count {
    margin: 8px 10px 0;
    font-size: 11px; color: var(--accent);
    padding: 4px 8px; background: rgba(86,156,214,0.12);
    border-radius: 3px; text-align: center;
    border: 1px solid var(--accent-dim);
  }

  /* ─────────── Tree (17896 정본: 4-레벨 과목 > 카테고리 > 파일 > 케이스) ─────────── */
  .case-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .case-group-label {
    padding: 8px 12px 4px;
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .tree-node { user-select: none; }
  .tree-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    cursor: pointer;
    color: var(--text);
    font-family: inherit;
  }
  .tree-header:hover { background: var(--panel-2); }
  .tree-header .arrow {
    display: inline-block;
    width: 10px;
    font-size: 9px;
    color: var(--text-dim);
    transition: transform 0.15s;
    flex-shrink: 0;
  }
  .tree-node.collapsed > .tree-header .arrow { transform: rotate(-90deg); }
  .tree-node.collapsed > .tree-body { display: none; }
  .tree-header .tree-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-header .tree-count { color: var(--text-dim); font-size: 10px; font-family: 'SF Mono', Consolas, monospace; }
  .tree-header .dir-checkbox { cursor: pointer; accent-color: var(--accent); flex-shrink: 0; }

  /* 레벨별 들여쓰기 + 폰트 사이즈 (17896 정본) */
  .tree-l1 > .tree-header { font-size: 12px; font-weight: 600; color: var(--text-bright); padding-left: 10px; }
  .tree-l2 > .tree-header { font-size: 11px; color: var(--text); padding-left: 22px; }
  .tree-l3 > .tree-header { font-size: 11px; color: var(--text-dim); padding-left: 34px; }
  .tree-l3 > .tree-header:hover { color: var(--text); }
  .tree-l1 > .tree-body { /* 자체 패딩 X — children 가 자기 padding 결정 */ }
  /* 케이스 항목 들여쓰기 (17896 정본 46px) */
  .tree-l3 .case-item { padding-left: 46px; }

  /* Case 항목 (17896 정본 + 체크박스 행 추가) */
  .case-item {
    padding: 6px 12px 6px 12px;
    border-left: 2px solid transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .case-item:hover { background: var(--panel-2); }
  .case-item.active { background: var(--panel-2); border-left-color: var(--accent); color: var(--text-bright); }
  .case-item-row { display: flex; align-items: center; gap: 6px; }
  .case-item-row input[type="checkbox"] {
    flex-shrink: 0; cursor: pointer; accent-color: var(--accent);
  }
  .case-item .case-id {
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 11px;
    color: var(--accent);
  }
  .case-item .case-title { font-size: 12px; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .case-item .case-meta {
    font-size: 10px;
    color: var(--text-dim);
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }
  .case-item .case-meta .pill {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 2px;
  }
  .case-item .case-meta .pill.warn { color: var(--warn); border-color: var(--warn); }
  .case-item .case-meta .pill.stale { color: var(--text-dim); }
  .case-item .case-meta .pill.bookmarked { color: var(--accent); }
  .case-item .case-meta .pill.bookmark-star { color: var(--text-dim); opacity: 0.4; cursor: pointer; user-select: none; }
  .case-item .case-meta .pill.bookmark-star.bookmarked { color: var(--accent); opacity: 1; }
  .case-item .case-meta .pill.bookmark-star:hover { opacity: 1; }

  /* ─────────── Sidebar Toggle (17896 정본) ─────────── */
  #sidebar-toggle {
    position: absolute;
    top: 10px;
    left: 280px;
    z-index: 50;
    width: 18px;
    height: 32px;
    border: 1px solid var(--border);
    border-left: none;
    background: var(--panel);
    color: var(--text-dim);
    border-radius: 0 4px 4px 0;
    cursor: pointer;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: left 0.18s;
  }
  #sidebar-toggle:hover { background: var(--panel-2); color: var(--accent); }
  #sidebar.collapsed ~ #sidebar-toggle { left: 0; }

  /* Right Toggle Buttons */
  .right-toggles { position: fixed; top: 10px; right: 14px; z-index: 100; display: flex; gap: 6px; }
  .right-toggles button {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    background: var(--panel); color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .right-toggles button:hover { background: var(--panel-2); color: var(--accent); }
  #stealth-toggle.active { background: var(--accent-strong); color: #fff; border-color: var(--accent-strong); }
  #editor-toggle.active { background: #d97706; color: #fff; border-color: #d97706; }

  /* ─────────── Content ─────────── */
  #content { flex: 1; overflow-y: auto; padding: 32px 48px; min-width: 0; }
  #content h1 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 16px; }
  #content h2 { color: var(--text-bright); margin-top: 24px; margin-bottom: 8px; border-bottom: 1px solid var(--panel-2); padding-bottom: 4px; }
  #content h3 { color: var(--text); margin-top: 16px; margin-bottom: 8px; }
  #content p { line-height: 1.7; margin-bottom: 8px; }
  #content pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow-x: auto; margin: 8px 0; font-size: 13px; }
  #content code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; }
  #content table { width: 100%; border-collapse: collapse; margin: 8px 0; }
  #content th, #content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 13px; vertical-align: top; }
  #content th { background: var(--panel); color: var(--accent); }
  #content ul, #content ol { padding-left: 24px; margin-bottom: 8px; }
  #content li { line-height: 1.6; margin-bottom: 4px; }
  #content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text-dim); margin: 8px 0; }

  .compare-table { table-layout: fixed; width: 100%; }
  .compare-table th { width: 33.33%; text-align: center; }
  .compare-table td { font-size: 12px; line-height: 1.5; }
  .compare-table td h3, .compare-table td h4 { font-size: 13px; margin-top: 12px; }

  /* Page Header (Case 메타 표시) */
  .page-header {
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
    margin-bottom: 16px;
    display: flex; align-items: baseline;
    gap: 12px; flex-wrap: wrap;
  }
  .page-header .case-id-large {
    font-family: 'SF Mono', Consolas, monospace;
    color: var(--accent); font-size: 14px;
  }
  .page-header .case-subject {
    font-size: 11px; color: var(--text-dim);
  }
  .page-header .breadcrumb {
    font-size: 11px; color: var(--text-dim); flex-basis: 100%;
  }
  .page-header .breadcrumb span.crumb-sep { margin: 0 6px; color: var(--text-mute); }

  /* 라이브러리(두문자) 업로드 바 — library 분기에서만 노출 */
  .library-upload-bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 0 0 14px; padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    font-size: 12px;
  }
  .library-upload-bar .lib-upload-btn {
    padding: 6px 14px;
    background: var(--accent-dim);
    color: #fff;
    border: 1px solid var(--accent);
    border-radius: 3px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .library-upload-bar .lib-upload-btn:hover { background: var(--accent); }
  .library-upload-bar .lib-upload-btn:disabled { opacity: 0.5; cursor: progress; }
  .library-upload-bar .lib-upload-hint { color: var(--text-dim); font-size: 11px; }
  .library-upload-bar .lib-upload-hint code {
    background: var(--bg); padding: 1px 5px; border-radius: 2px;
    color: var(--link); font-family: 'SF Mono', Consolas, monospace;
  }
  .library-upload-bar .lib-upload-status { color: var(--text); font-size: 11px; margin-left: auto; }
  .library-upload-bar .lib-upload-status.ok { color: var(--success); }
  .library-upload-bar .lib-upload-status.err { color: var(--danger); }
  .library-upload-bar .lib-upload-status.pending { color: var(--warn); }

  .lv-tabs {
    display: flex; gap: 8px; margin-bottom: 16px;
    position: sticky; top: 0; background: var(--bg);
    padding: 8px 0; z-index: 10;
  }
  .lv-tab {
    padding: 6px 16px; border-radius: 20px; font-size: 13px;
    cursor: pointer; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-dim);
  }
  .lv-tab:hover { border-color: var(--accent); color: var(--accent); }
  .lv-tab.active { background: var(--accent-strong); color: #fff; border-color: var(--accent-strong); }

  .empty { color: var(--text-mute); text-align: center; margin-top: 40vh; font-size: 14px; }

  /* 강조 표시 (P-12 R-28) */
  .tts-red    { color: #ff6b6b; font-weight: 500; }
  .tts-blue   { color: #4dabf7; font-weight: 500; }
  .tts-bold   { color: #ffd43b; font-weight: 700; }
  .tts-underline { text-decoration: underline; text-decoration-color: #adb5bd; text-decoration-thickness: 2px; }
  .tts-blank  { background: #ffd43b; color: #1971c2; padding: 0 6px; border-radius: 3px; font-weight: 600; }
  .tts-blank2 { background: #c92a2a; color: #ffd43b; padding: 0 6px; border-radius: 3px; font-weight: 600; }

  /* 위장 모드 — 좌측 패널 한글 노출 부분 숨김 (case-title, case-meta) */
  body.stealth .case-item .case-title { display: none; }
  body.stealth .case-item .case-meta { display: none; }

  /* 위장 모드 — 강조 표시 모두 무효화 */
  body.stealth .tts-red,
  body.stealth .tts-blue,
  body.stealth .tts-bold,
  body.stealth .tts-underline,
  body.stealth .tts-blank,
  body.stealth .tts-blank2 {
    color: inherit !important;
    background: transparent !important;
    font-weight: normal !important;
    text-decoration: none !important;
    padding: 0 !important;
    border-radius: 0 !important;
  }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: center; justify-content: center; z-index: 1000;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; min-width: 360px; max-width: 480px;
  }
  .modal h3 { color: var(--accent); margin-bottom: 8px; font-size: 16px; }
  .modal .modal-info { color: var(--text-dim); font-size: 13px; margin-bottom: 16px; }
  .modal label {
    display: block; padding: 8px 12px; margin-bottom: 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
    font-size: 14px;
  }
  .modal label:hover { border-color: var(--accent); }
  .modal label input[type="radio"] { margin-right: 8px; accent-color: var(--accent); }
  .modal-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-buttons button {
    padding: 8px 18px; font-size: 13px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
  }
  .modal-buttons button.primary { background: var(--success-strong); color: #fff; border-color: var(--success); }
  .modal-buttons button.primary:hover { background: var(--success); }
  .modal-buttons button:hover { background: var(--border); }

  /* ─────────── Editor ─────────── */
  #editor-wrap { display: none; height: calc(100vh - 64px); flex-direction: column; }
  body.editing #content { padding: 32px 24px 16px; display: flex; flex-direction: column; }
  body.editing #content > .lv-tabs,
  body.editing #content > #mdContent,
  body.editing #content > .page-header,
  body.editing #content > #empty-msg { display: none !important; }
  body.editing #editor-wrap { display: flex; }

  .editor-toolbar {
    display: flex; gap: 6px; padding: 8px 0;
    border-bottom: 1px solid var(--border); margin-bottom: 12px;
    align-items: center; flex-wrap: wrap;
  }
  .editor-toolbar .label { font-size: 12px; color: var(--text-dim); margin-right: 4px; }
  .editor-toolbar button {
    padding: 5px 12px; font-size: 13px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  .editor-toolbar button:hover { background: var(--panel-2); border-color: var(--accent); }
  .em-btn { font-weight: 600; min-width: 56px; }
  .em-btn.em-red { color: #ff6b6b; }
  .em-btn.em-blue { color: #4dabf7; }
  .em-btn.em-bold { color: #ffd43b; font-weight: 700; }
  .em-btn.em-underline { color: #adb5bd; text-decoration: underline; }
  .em-btn.em-blank { background: #ffd43b; color: #1971c2; border-color: #fab005; }
  .em-btn.em-blank2 { background: #c92a2a; color: #ffd43b; border-color: #a51e1e; }
  .em-btn.em-clear { color: var(--danger); }
  .save-btn {
    background: var(--success-strong) !important; color: #fff !important;
    border-color: var(--success) !important; margin-left: auto;
    padding: 6px 18px !important;
  }
  .save-btn:hover { background: var(--success) !important; }
  .save-btn:disabled { background: var(--text-mute) !important; cursor: not-allowed; }
  .save-status { font-size: 12px; color: var(--text-dim); min-width: 160px; text-align: right; }
  .save-status.success { color: var(--success); }
  .save-status.error { color: var(--danger); }

  .editor-split { display: flex; gap: 16px; flex: 1; min-height: 0; }
  .editor-split textarea {
    flex: 1; min-width: 0; padding: 16px;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    resize: none; line-height: 1.6; tab-size: 2;
  }
  .editor-split textarea:focus { border-color: var(--accent); outline: none; }
  .editor-split .editor-preview {
    flex: 1; min-width: 0; padding: 16px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; line-height: 1.7;
  }
  .editor-preview h1, .editor-preview h2, .editor-preview h3 {
    color: var(--text-bright); margin: 12px 0 8px;
  }
  .editor-preview p { margin-bottom: 8px; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="sidebar-header">
    <h2 id="sidebar-title">Internal Review Console <span class="sub">/ TTS Merge</span></h2>
    <div class="stats" id="stats"></div>
  </div>
  <div class="filters">
    <div class="filter-row">
      <button class="active" data-filter="all" id="filter-all">All Cases</button>
      <button data-filter="err" id="filter-err">High Error</button>
      <button data-filter="stale" id="filter-stale">Long Pending</button>
      <button data-filter="book" id="filter-book">Bookmarked</button>
    </div>
    <input type="text" class="search" id="search" placeholder="Search by ID or keyword…">
  </div>
  <div class="sidebar-actions">
    <button onclick="openDownloadModal()" class="primary" id="btn-download">Download</button>
    <button onclick="expandAll()" id="btn-expand">Expand all</button>
    <button onclick="collapseAll()" id="btn-collapse">Collapse all</button>
  </div>
  <div class="selected-count" id="selected-count">Selected: 0</div>
  <div class="case-list" id="fileTree">
    <div class="case-group-label" style="padding: 12px;">Loading…</div>
  </div>
  <div class="sidebar-actions">
    <a href="http://127.0.0.1:17896/" target="_blank" rel="noopener" style="flex: 1; padding: 6px 8px; font-size: 12px; background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 4px; cursor: pointer; text-align: center; text-decoration: none;" onmouseover="this.style.background='#21262d'; this.style.color='#58a6ff'; this.style.borderColor='#58a6ff';" onmouseout="this.style.background='#161b22'; this.style.color='#c9d1d9'; this.style.borderColor='#30363d';" title="17896 Internal Review Console (새 탭)">🎯 Console (17896)</a>
  </div>
</div>
<button id="sidebar-toggle" onclick="toggleSidebar()" title="Sidebar Toggle (B)">‹</button>
<div class="right-toggles">
  <button id="editor-toggle" onclick="toggleEditor()" title="편집 모드 토글 (E)">✏️</button>
  <button id="stealth-toggle" onclick="toggleStealth()" title="위장 모드 토글 (Z)">👀</button>
</div>
<div id="content">
  <div class="empty" id="empty-msg">좌측에서 파일을 선택하세요</div>
  <div id="editor-wrap">
    <div class="editor-toolbar">

<script>
// ─────────── 상태 ───────────
let fileIndex = {};       // {dir: [filename, ...]} — 구 형식 호환용
let fileMetadata = {};    // path → 풍부 메타 (id, subject, subjectKor, category, file, fileKor, case, title, points, userCase, ...)
let currentFile = null;
let currentPath = null;   // dir/filename
let fullContent = '';
let selectedFiles = new Set();
let stealthMode = localStorage.getItem('stealth') === 'true';

// Tree 상태 (localStorage 영속)
const TREE_STATE_KEY = 'lawear_merge_tree_state';
function loadTreeState() {
  try {
    const raw = localStorage.getItem(TREE_STATE_KEY);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    return (obj && typeof obj === 'object') ? obj : {};
  } catch (e) { return {}; }
}
function saveTreeState(state) {
  try { localStorage.setItem(TREE_STATE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
}
function treeNodeKey(level, ...parts) {
  return `${level}:${parts.join('|')}`;
}

// 카테고리 표시 순서 (사용자 학습 우선순위) — '민법'/'민소'는 두문자 라이브러리용 (최상위)
const CATEGORY_ORDER = ['민법', '민소', '입문', '예비', '1순환', '2순환', '3순환', '모의고사', '모고'];
function categoryRank(cat) {
  const idx = CATEGORY_ORDER.indexOf(cat || '');
  return idx >= 0 ? idx : 999;
}

// 과목 표시 순서 ('두문자'를 최상위로)
const SUBJECT_ORDER = ['두문자', '민법', '민소법', '민소', '민사소송법', '형법', '형소법', '형소', '형사소송법', '부등법', '부등', '민사서류', '부등서류'];
function subjectRank(s) {
  const idx = SUBJECT_ORDER.indexOf(s || '');
  return idx >= 0 ? idx : 999;
}

// ─────────── 위장 모드 매핑 ───────────
const stealthSubjectMap = {
  '두문자': 'Index',
  '민법': 'Civil', '민소법': 'CivilProc', '민소': 'CivilProc',
  '형법': 'Criminal', '형소법': 'CrimProc', '형소': 'CrimProc',
  '부등법': 'RealEstate', '부등': 'RealEstate',
  '민사서류': 'CivilDocs', '부등서류': 'REDocs',
};
const stealthCategoryMap = {
  '입문': 'Intro', '예비': 'Prelim',
  '1순환': 'Cycle1', '2순환': 'Cycle2', '3순환': 'Cycle3',
  '모의고사': 'Mock', '모고': 'Mock',
  '민법': 'Civil', '민소': 'CivilProc',
};
// 디렉토리 → 위장 (구 형식 호환)
const stealthDirMap = {
  '두문자': '000_idx',
  '입문_민법': '002_min', '입문_민소': '002_mso',
  '입문_형법': '002_hyung', '입문_부등': '002_bu',
  '예비_민법': '001_min', '예비_민소': '001_mso',
  '예비_형법': '001_hyung', '예비_형소': '001_hso',
  '1순환_민법': '010_min', '1순환_민소': '010_mso',
  '1순환_형법': '010_hyung', '1순환_형소': '010_hso',
  '2순환_민법': '020_min', '2순환_민소': '020_mso',
  '2순환_형법': '020_hyung', '2순환_형소': '020_hso',
  '3순환_민법': '030_min', '3순환_민소': '030_mso',
  '3순환_형법': '030_hyung', '3순환_형소': '030_hso',
  '입문_부등서류': '002_bso', '입문_민사서류': '002_msso',
};
// 17896 동일 톤: 사이드바는 영문 위주, real 모드에서 한글 라벨 일부만 사용
const stealthUI = {
  pageTitle: { real: 'Internal Review Console', fake: 'Internal Review Console' },
  sidebarTitle: { real: 'Internal Review Console <span class="sub">/ TTS Merge</span>', fake: 'Internal Review Console <span class="sub">/ Documents</span>' },
  search: { real: 'Search by ID or keyword…', fake: 'Search by ID or keyword…' },
  filterAll: { real: 'All Cases', fake: 'All Cases' },
  filterErr: { real: 'High Error', fake: 'High Error' },
  filterStale: { real: 'Long Pending', fake: 'Long Pending' },
  filterBook: { real: 'Bookmarked', fake: 'Bookmarked' },
  download: { real: 'Download', fake: 'Download' },
  expand: { real: 'Expand all', fake: 'Expand all' },
  collapse: { real: 'Collapse all', fake: 'Collapse all' },
  selectedCount: { real: 'Selected', fake: 'Selected' },
  emptyMsg: { real: '좌측에서 파일을 선택하세요', fake: 'Select a document from the left' },
  tabs: { real: ['원본', '전체', 'Lv.1', 'Lv.4'], fake: ['Source', 'All', 'V1', 'V4'] },
};

function displaySubject(s) {
  return stealthMode ? (stealthSubjectMap[s] || s) : s;
}
function displayCategory(c) {
  return stealthMode ? (stealthCategoryMap[c] || c) : c;
}
function displayDir(dir) {
  return stealthMode ? (stealthDirMap[dir] || dir) : dir;
}
function displayFile(filename) {
  // 풍부 메타 사용: filename → file (예: 미케01)
  const base = filename.replace('.md', '');
  if (stealthMode) {
    const mike = base.match(/미케(\d+)_(\d+)/);
    if (mike) return `sub_${mike[1]}_${mike[2]}`;
    const mogoSub = base.match(/모고(\d+)_(\d+)/);
    if (mogoSub) return `mo_${mogoSub[1]}_${mogoSub[2]}`;
    const mogo = base.match(/모고(\d+)/);
    if (mogo) return `mo_${mogo[1]}`;
    return base.replace(/2026_(minbeop|minso|hyungbeop|hyungso|budeung)_(yebi|immun)_/, '');
  }
  return base.replace(/2026_(minbeop|minso|hyungbeop|hyungso|budeung)_(yebi|immun)_/, '');
}
// fileKor 위장 (예: '민법_입문_미케_01' → 'sub_01_NN')
function displayFileKor(fileKor, fileCode) {
  if (!stealthMode) return fileKor;
  const m = (fileCode || '').match(/^미케(\d+)$/);
  if (m) return `sub_${m[1]}`;
  const mg = (fileCode || '').match(/^모고(\d+)$/);
  if (mg) return `mo_${mg[1]}`;
  return fileCode || fileKor;
}

// ─────────── 강조 렌더링 ───────────
function renderMd(md) {
  const placeholders = [];
  const tagRe = /\[(red|blue|bold|u|blank2|blank)\]((?:(?!\[(?:red|blue|bold|u|blank2|blank)\])[\s\S])*?)\[\/\1\]/g;
  let escaped = md;
  let prev;
  let iter = 0;
  do {
    prev = escaped;
    escaped = escaped.replace(tagRe, (m, tag, content) => {
      placeholders.push({ tag, content });
      return `@@EMP${placeholders.length - 1}@@`;
    });
    iter++;
  } while (escaped !== prev && iter < 20);

  let html = marked.parse(escaped);

  function recover(s) {
    return s.replace(/@@EMP(\d+)@@/g, (m, i) => {
      const { tag, content } = placeholders[parseInt(i, 10)];
      const cls = tag === 'u' ? 'tts-underline' : 'tts-' + tag;
      const inner = recover(content);
      return `<span class="${cls}">${inner}</span>`;
    });
  }
  return recover(html);
}

// ─────────── 위장 UI 적용 ───────────
function applyStealthUI() {
  const t = stealthUI;
  const k = stealthMode ? 'fake' : 'real';
  document.getElementById('page-title').textContent = t.pageTitle[k];
  document.title = t.pageTitle[k];
  document.getElementById('sidebar-title').innerHTML = t.sidebarTitle[k];
  document.getElementById('search').placeholder = t.search[k];
  document.getElementById('filter-all').textContent = t.filterAll[k];
  document.getElementById('filter-err').textContent = t.filterErr[k];
  document.getElementById('filter-stale').textContent = t.filterStale[k];
  document.getElementById('filter-book').textContent = t.filterBook[k];
  document.getElementById('btn-download').textContent = t.download[k];
  document.getElementById('btn-expand').textContent = t.expand[k];
  document.getElementById('btn-collapse').textContent = t.collapse[k];
  const empty = document.getElementById('empty-msg');
  if (empty) empty.textContent = t.emptyMsg[k];
  document.getElementById('stealth-toggle').textContent = stealthMode ? '🔓' : '👀';
  document.getElementById('stealth-toggle').classList.toggle('active', stealthMode);
  updateSelectedCount();
}

function toggleStealth() {
  stealthMode = !stealthMode;
  localStorage.setItem('stealth', stealthMode);
  document.body.classList.toggle('stealth', stealthMode);
  applyStealthUI();
  renderTree(document.getElementById('search').value);
  if (currentFile) renderContent();
}

// ─────────── 초기화 ───────────
async function init() {
  const res = await fetch('_file_index.json');
  const raw = await res.json();
  if (raw.files && Array.isArray(raw.files)) {
    fileIndex = {};
    fileMetadata = {};
    for (const item of raw.files) {
      const slash = item.path.indexOf('/');
      const dir = item.path.slice(0, slash);
      const fname = item.path.slice(slash + 1);
      if (!fileIndex[dir]) fileIndex[dir] = [];
      fileIndex[dir].push(fname);
      fileMetadata[item.path] = item;
    }
  } else {
    fileIndex = raw;
    fileMetadata = {};
  }
  const total = Object.values(fileIndex).reduce((s, v) => s + v.length, 0);
  const ndir = Object.keys(fileIndex).length;
  document.getElementById('stats').textContent = `${ndir} dirs · ${total} cases`;
  document.body.classList.toggle('stealth', stealthMode);
  applyStealthUI();
  renderTree();
}

function updateSelectedCount() {
  const k = stealthMode ? 'fake' : 'real';
  document.getElementById('selected-count').textContent = `${stealthUI.selectedCount[k]}: ${selectedFiles.size}`;
}

// ─────────── 트리 빌드 (L1 과목 > L2 카테고리 > L3 파일 > L4 Case) ───────────
//
// 데이터 소스:
//   1. 풍부 메타 있는 파일 (fileMetadata[path]) → subjectKor + category + fileKor + case + points + title 활용
//   2. 풍부 메타 없는 파일 → dir 그대로 L1=dir, L3=filename 단일 트리로 fallback
function renderTree(filter = '') {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = '';
  const lowerFilter = (filter || '').toLowerCase();
  const searching = lowerFilter.length > 0;

  // 트리 구조 빌드
  //   tree4 = Map<subjectKor, {subject, subjectKor, categories: Map<category, {category, files: Map<fileCode, {fileCode, fileKor, items: [meta], dir}>}>}
  //   libraryTree = Map<subjectKor, {subjectKor, items: [{meta, filename, path, dir}]}>  ← type==="library" 평탄 트리
  //   noMeta = Map<dir, [{filename, path}]>  ← 메타 없는 파일들
  const tree4 = new Map();
  const libraryTree = new Map();
  const noMeta = new Map();

  for (const [dir, files] of Object.entries(fileIndex)) {
    for (const f of files) {
      const path = `${dir}/${f}`;
      const meta = fileMetadata[path];
      // 17896 정본 필터 (all/err/stale/book)
      if (!filterMatch(meta || {}, path)) continue;
      // 필터링: search term 매칭
      if (searching) {
        const hay = [
          f, path, dir,
          meta && meta.subjectKor, meta && meta.category, meta && meta.fileKor,
          meta && meta.file, meta && meta.title, meta && meta.id,
          meta && meta.type, meta && meta.case,
          displayFile(f), displayDir(dir),
          meta && displaySubject(meta.subjectKor),
        ].filter(Boolean).join(' ').toLowerCase();
        if (!hay.includes(lowerFilter)) continue;
      }
      if (meta && meta.type === 'library' && meta.subjectKor) {
        // 두문자 등 라이브러리: 평탄 트리 (L1 subjectKor → L2 case 항목 직접)
        const sk = meta.subjectKor;
        if (!libraryTree.has(sk)) libraryTree.set(sk, { subjectKor: sk, subject: meta.subject, items: [] });
        libraryTree.get(sk).items.push({ meta, filename: f, path, dir });
      } else if (meta && meta.subjectKor && meta.category && meta.fileKor) {
        const sk = meta.subjectKor;
        const cat = meta.category;
        const fileCode = meta.file || meta.fileKor;
        if (!tree4.has(sk)) tree4.set(sk, { subject: meta.subject, subjectKor: sk, categories: new Map() });
        const subjNode = tree4.get(sk);
        if (!subjNode.categories.has(cat)) subjNode.categories.set(cat, { category: cat, files: new Map() });
        const catNode = subjNode.categories.get(cat);
        if (!catNode.files.has(fileCode)) catNode.files.set(fileCode, { fileCode, fileKor: meta.fileKor, items: [], dir });
        catNode.files.get(fileCode).items.push({ meta, filename: f, path, dir });
      } else {
        if (!noMeta.has(dir)) noMeta.set(dir, []);
        noMeta.get(dir).push({ filename: f, path });
      }
    }
  }

  // 빈 결과 처리
  if (tree4.size === 0 && libraryTree.size === 0 && noMeta.size === 0) {
    tree.innerHTML = '<div style="padding:16px;color:#484f58;font-size:12px;text-align:center;">매칭 결과 없음</div>';
    updateSelectedCount();
    return;
  }

  const state = loadTreeState();
  let html = '';

  // ─── 라이브러리 트리 (두문자 등): L1 subjectKor → L2 case 직접 (2단 평탄) ───
  const sortedLibrary = Array.from(libraryTree.entries()).sort((a, b) => subjectRank(a[0]) - subjectRank(b[0]));
  for (const [sk, libNode] of sortedLibrary) {
    const l1Key = treeNodeKey('lib', sk);
    const l1Collapsed = !searching && state[l1Key] === false;
    html += `<div class="tree-node tree-l1${l1Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l1Key)}">`;
    html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l1Key)}">`;
    html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displaySubject(sk))}</span>`;
    html += `<span class="tree-count">${libNode.items.length}</span></div>`;
    html += `<div class="tree-body">`;
    const items = libNode.items.slice().sort((a, b) => (a.meta.case || '').localeCompare(b.meta.case || ''));
    for (const it of items) {
      const m = it.meta;
      const active = (currentPath === it.path) ? ' active' : '';
      const caseLabel = stealthMode ? (stealthCategoryMap[m.case] || m.case || '') : (m.case || '');
      const title = (m.title || '').trim();
      const bm = isBookmarked(it.path);
      const starCls = bm ? 'pill bookmark-star bookmarked' : 'pill bookmark-star';
      const pills = [`<span class="${starCls}" data-bookmark-toggle="${escapeAttr(it.path)}" title="${bm ? 'Remove bookmark' : 'Add bookmark'}">★</span>`];
      html += `<div class="case-item${active}" data-path="${escapeAttr(it.path)}" style="padding-left: 22px;">`;
      html += `<div class="case-item-row">`;
      html += `<span class="case-id">${escapeHtml(caseLabel)}</span>`;
      html += `</div>`;
      html += `<div class="case-title" title="${escapeAttr(title)}">${escapeHtml(title)}</div>`;
      html += `<div class="case-meta">${pills.join('')}</div>`;
      html += `</div>`;
    }
    html += `</div></div>`;
  }

  // ─── 풍부 메타 트리 (L1~L4) ───
  const sortedSubjects = Array.from(tree4.entries()).sort((a, b) => subjectRank(a[0]) - subjectRank(b[0]));
  for (const [sk, subjNode] of sortedSubjects) {
    const l1Key = treeNodeKey('s', sk);
    const l1Collapsed = !searching && state[l1Key] === false;
    let l1TotalCases = 0;
    for (const cat of subjNode.categories.values()) {
      for (const fileNode of cat.files.values()) l1TotalCases += fileNode.items.length;
    }

    html += `<div class="tree-node tree-l1${l1Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l1Key)}">`;
    html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l1Key)}">`;
    html += `<input type="checkbox" class="dir-checkbox" data-subject="${escapeAttr(sk)}" onclick="event.stopPropagation(); toggleSubjectSelection('${escapeAttr(sk)}', this.checked);">`;
    html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displaySubject(sk))}</span>`;
    html += `<span class="tree-count">${l1TotalCases}</span></div>`;
    html += `<div class="tree-body">`;

    const sortedCats = Array.from(subjNode.categories.entries()).sort((a, b) => categoryRank(a[0]) - categoryRank(b[0]));
    for (const [cat, catNode] of sortedCats) {
      const l2Key = treeNodeKey('c', sk, cat);
      const l2Collapsed = !searching && state[l2Key] === false;
      let l2TotalCases = 0;
      for (const fileNode of catNode.files.values()) l2TotalCases += fileNode.items.length;

      html += `<div class="tree-node tree-l2${l2Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l2Key)}">`;
      html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l2Key)}">`;
      html += `<input type="checkbox" class="dir-checkbox" data-cat="${escapeAttr(sk + '|' + cat)}" onclick="event.stopPropagation(); toggleCategorySelection('${escapeAttr(sk)}', '${escapeAttr(cat)}', this.checked);">`;
      html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displayCategory(cat))}</span>`;
      html += `<span class="tree-count">${l2TotalCases}</span></div>`;
      html += `<div class="tree-body">`;

      const sortedFiles = Array.from(catNode.files.entries()).sort((a, b) => a[0].localeCompare(b[0]));
      for (const [fileCode, fileNode] of sortedFiles) {
        const l3Key = treeNodeKey('f', sk, cat, fileCode);
        // L3 디폴트: 검색 중이거나 펼침 저장된 경우만 펼침
        const l3Collapsed = !searching && state[l3Key] !== true;
        // 파일명 표시: fileKor에서 과목/카테고리 빼고 단순화
        let fileLabel = fileNode.fileKor || fileCode;
        // 예: '민법_입문_미케_01' → '미케_01' (과목, 카테고리 prefix 제거)
        fileLabel = fileLabel.replace(new RegExp(`^${sk}_${cat}_`), '').replace(new RegExp(`^${sk}_`), '');
        if (stealthMode) fileLabel = displayFileKor(fileNode.fileKor, fileCode);

        html += `<div class="tree-node tree-l3${l3Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l3Key)}">`;
        html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l3Key)}">`;
        html += `<input type="checkbox" class="dir-checkbox" data-file="${escapeAttr(sk + '|' + cat + '|' + fileCode)}" onclick="event.stopPropagation(); toggleFileSelection('${escapeAttr(sk)}', '${escapeAttr(cat)}', '${escapeAttr(fileCode)}', this.checked);">`;
        html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(fileLabel)}</span>`;
        html += `<span class="tree-count">${fileNode.items.length}</span></div>`;
        html += `<div class="tree-body">`;

        // L4: Case 항목 (17896 정본: case-id 한 줄, case-title 한 줄, case-meta 한 줄 pills)
        const items = fileNode.items.slice().sort((a, b) => (a.meta.case || '').localeCompare(b.meta.case || ''));
        for (const it of items) {
          const m = it.meta;
          const checked = selectedFiles.has(it.path) ? ' checked' : '';
          const active = (currentPath === it.path) ? ' active' : '';
          // 17896 정본 short ID: <file>-<case_no>  (예: 미케01-01) / stealth: sub_01-01
          const fileShort = stealthMode ? displayFileKor(m.fileKor, m.file) : m.file;
          const shortId = `${fileShort}-${m.case}`;
          const title = (m.title || '').trim();

          // 17896 pills (points 항상, userCase 있을 때, bookmark star)
          const pills = [];
          if (m.points != null) pills.push(`<span class="pill">${m.points} pt</span>`);
          // err / stale 데이터 미지원 → skip (17896 데이터에만 있음)
          if (m.userCase != null && !stealthMode) pills.push(`<span class="pill stale">U${m.userCase}</span>`);
          // bookmark — localStorage 기반 (간단)
          const bm = isBookmarked(it.path);
          const starCls = bm ? 'pill bookmark-star bookmarked' : 'pill bookmark-star';
          pills.push(`<span class="${starCls}" data-bookmark-toggle="${escapeAttr(it.path)}" title="${bm ? 'Remove bookmark' : 'Add bookmark'}">★</span>`);

          html += `<div class="case-item${active}" data-path="${escapeAttr(it.path)}">`;
          html += `<div class="case-item-row">`;
          html += `<input type="checkbox" data-path="${escapeAttr(it.path)}"${checked} onclick="event.stopPropagation(); toggleFile(this);">`;
          html += `<span class="case-id">${escapeHtml(shortId)}</span>`;
          html += `</div>`;
          html += `<div class="case-title" title="${escapeAttr(title)}">${escapeHtml(title)}</div>`;
          html += `<div class="case-meta">${pills.join('')}</div>`;
          html += `</div>`;
        }
        html += `</div></div>`; // /tree-l3 body + node
      }
      html += `</div></div>`; // /tree-l2 body + node
    }
    html += `</div></div>`; // /tree-l1 body + node
  }

  // ─── 풍부 메타 없는 파일들 (fallback: 디렉토리만 표시) ───
  for (const [dir, files] of noMeta.entries()) {
    const l1Key = treeNodeKey('d', dir);
    const l1Collapsed = !searching && state[l1Key] === false;
    html += `<div class="tree-node tree-l1${l1Collapsed ? ' collapsed' : ''}" data-tree-key="${escapeAttr(l1Key)}">`;
    html += `<div class="tree-header" data-tree-toggle="${escapeAttr(l1Key)}">`;
    html += `<input type="checkbox" class="dir-checkbox" data-dir="${escapeAttr(dir)}" onclick="event.stopPropagation(); toggleDirSelection('${escapeAttr(dir)}', this.checked);">`;
    html += `<span class="arrow">▾</span><span class="tree-label">${escapeHtml(displayDir(dir))}</span>`;
    html += `<span class="tree-count">${files.length}</span></div>`;
    html += `<div class="tree-body">`;
    for (const item of files) {
      const checked = selectedFiles.has(item.path) ? ' checked' : '';
      const active = (currentPath === item.path) ? ' active' : '';
      html += `<div class="case-item${active}" data-path="${escapeAttr(item.path)}">`;
      html += `<div class="case-item-row">`;
      html += `<input type="checkbox" data-path="${escapeAttr(item.path)}"${checked} onclick="event.stopPropagation(); toggleFile(this);">`;
      html += `<span class="case-title">${escapeHtml(displayFile(item.filename))}</span>`;
      html += `</div></div>`;
    }
    html += `</div></div>`;
  }

  tree.innerHTML = html;

  // 트리 toggle 이벤트
  tree.querySelectorAll('.tree-header[data-tree-toggle]').forEach(h => {
    h.addEventListener('click', (ev) => {
      // 체크박스 클릭은 무시
      if (ev.target.tagName === 'INPUT') return;
      const node = h.closest('.tree-node');
      if (!node) return;
      node.classList.toggle('collapsed');
      const key = h.dataset.treeToggle;
      const s = loadTreeState();
      if (node.classList.contains('collapsed')) s[key] = node.classList.contains('tree-l3') ? false : false;
      else s[key] = node.classList.contains('tree-l3') ? true : true;
      saveTreeState(s);
      ev.stopPropagation();
    });
  });

  // Case 클릭 → 파일 로드 (단, ★ 북마크 클릭은 토글)
  tree.querySelectorAll('.case-item').forEach(item => {
    item.addEventListener('click', (ev) => {
      if (ev.target && ev.target.dataset && ev.target.dataset.bookmarkToggle) {
        ev.stopPropagation();
        toggleBookmark(ev.target.dataset.bookmarkToggle);
        return;
      }
      if (ev.target.tagName === 'INPUT') return;
      const path = item.dataset.path;
      if (path) loadFileByPath(path);
    });
  });

  updateSelectedCount();
  updateDirCheckboxStates();
}

// ─────────── 북마크 (localStorage 기반 — DB 없음) ───────────
const BOOKMARK_KEY = 'lawear_merge_bookmarks';
function loadBookmarks() {
  try { return new Set(JSON.parse(localStorage.getItem(BOOKMARK_KEY) || '[]')); }
  catch (e) { return new Set(); }
}
function saveBookmarks(set) {
  try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(Array.from(set))); }
  catch (e) { /* ignore */ }
}
function isBookmarked(path) {
  if (!window.__bookmarks) window.__bookmarks = loadBookmarks();
  return window.__bookmarks.has(path);
}
function toggleBookmark(path) {
  if (!window.__bookmarks) window.__bookmarks = loadBookmarks();
  if (window.__bookmarks.has(path)) window.__bookmarks.delete(path);
  else window.__bookmarks.add(path);
  saveBookmarks(window.__bookmarks);
  renderTree(document.getElementById('search').value);
}

// ─────────── 필터 (17896 정본: all/err/stale/book) ───────────
let CURRENT_FILTER = 'all';
function filterMatch(meta, path) {
  if (CURRENT_FILTER === 'all') return true;
  if (CURRENT_FILTER === 'book') return isBookmarked(path);
  // err / stale: 데이터 없음 → 항상 빈 결과
  if (CURRENT_FILTER === 'err' || CURRENT_FILTER === 'stale') return false;
  return true;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }

// ─────────── 체크박스 선택 ───────────
function toggleFile(cb) {
  const path = cb.dataset.path;
  if (cb.checked) selectedFiles.add(path);
  else selectedFiles.delete(path);
  updateSelectedCount();
  updateDirCheckboxStates();
}

function toggleSubjectSelection(sk, checked) {
  for (const [path, meta] of Object.entries(fileMetadata)) {
    if (meta.subjectKor === sk) {
      if (checked) selectedFiles.add(path);
      else selectedFiles.delete(path);
    }
  }
  renderTree(document.getElementById('search').value);
}
function toggleCategorySelection(sk, cat, checked) {
  for (const [path, meta] of Object.entries(fileMetadata)) {
    if (meta.subjectKor === sk && meta.category === cat) {
      if (checked) selectedFiles.add(path);
      else selectedFiles.delete(path);
    }
  }
  renderTree(document.getElementById('search').value);
}
function toggleFileSelection(sk, cat, fileCode, checked) {
  for (const [path, meta] of Object.entries(fileMetadata)) {
    if (meta.subjectKor === sk && meta.category === cat && meta.file === fileCode) {
      if (checked) selectedFiles.add(path);
      else selectedFiles.delete(path);
    }
  }
  renderTree(document.getElementById('search').value);
}
function toggleDirSelection(dir, checked) {
  const files = fileIndex[dir] || [];
  files.forEach(f => {
    const path = `${dir}/${f}`;
    if (checked) selectedFiles.add(path);
    else selectedFiles.delete(path);
  });
  renderTree(document.getElementById('search').value);
}

function updateDirCheckboxStates() {
  // Subject
  document.querySelectorAll('.dir-checkbox[data-subject]').forEach(cb => {
    const sk = cb.dataset.subject;
    let total = 0, sel = 0;
    for (const [path, meta] of Object.entries(fileMetadata)) {
      if (meta.subjectKor === sk) { total++; if (selectedFiles.has(path)) sel++; }
    }
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === total) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
  // Category
  document.querySelectorAll('.dir-checkbox[data-cat]').forEach(cb => {
    const [sk, cat] = cb.dataset.cat.split('|');
    let total = 0, sel = 0;
    for (const [path, meta] of Object.entries(fileMetadata)) {
      if (meta.subjectKor === sk && meta.category === cat) { total++; if (selectedFiles.has(path)) sel++; }
    }
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === total) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
  // File
  document.querySelectorAll('.dir-checkbox[data-file]').forEach(cb => {
    const [sk, cat, fc] = cb.dataset.file.split('|');
    let total = 0, sel = 0;
    for (const [path, meta] of Object.entries(fileMetadata)) {
      if (meta.subjectKor === sk && meta.category === cat && meta.file === fc) { total++; if (selectedFiles.has(path)) sel++; }
    }
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === total) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
  // Dir (fallback)
  document.querySelectorAll('.dir-checkbox[data-dir]').forEach(cb => {
    const dir = cb.dataset.dir;
    const files = fileIndex[dir] || [];
    const sel = files.filter(f => selectedFiles.has(`${dir}/${f}`)).length;
    if (sel === 0) { cb.checked = false; cb.indeterminate = false; }
    else if (sel === files.length) { cb.checked = true; cb.indeterminate = false; }
    else { cb.checked = false; cb.indeterminate = true; }
  });
}

function expandAll() {
  document.querySelectorAll('.tree-node').forEach(g => g.classList.remove('collapsed'));
  // 상태 저장: 모든 노드 펼침
  const s = loadTreeState();
  document.querySelectorAll('.tree-node[data-tree-key]').forEach(n => {
    s[n.dataset.treeKey] = true;
  });
  saveTreeState(s);
}
function collapseAll() {
  document.querySelectorAll('.tree-node').forEach(g => g.classList.add('collapsed'));
  const s = loadTreeState();
  document.querySelectorAll('.tree-node[data-tree-key]').forEach(n => {
    s[n.dataset.treeKey] = false;
  });
  saveTreeState(s);
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const btn = document.getElementById('sidebar-toggle');
  sidebar.classList.toggle('collapsed');
  btn.textContent = sidebar.classList.contains('collapsed') ? '›' : '‹';
}

// ─────────── 파일 로드 ───────────
async function loadFileByPath(path) {
  const slash = path.indexOf('/');
  const dir = path.slice(0, slash);
  const filename = path.slice(slash + 1);
  document.querySelectorAll('.case-item').forEach(i => i.classList.toggle('active', i.dataset.path === path));
  const res = await fetch(path, { cache: 'no-store' });
  fullContent = await res.text();
  currentFile = filename;
  currentPath = path;
  renderContent();
}

// ─── 라이브러리(두문자) 업로드 핸들러 ───
function bindLibraryUpload() {
  const bar = document.querySelector('.library-upload-bar');
  if (!bar) return;
  const triggerBtn = bar.querySelector('[data-upload-trigger]');
  const key = triggerBtn && triggerBtn.getAttribute('data-upload-trigger');
  if (!key) return;
  const fileInput = document.getElementById(`lib-upload-${key}`);
  const statusEl = document.getElementById(`lib-upload-status-${key}`);
  const targetPath = bar.getAttribute('data-upload-path') || '';
  const subject = bar.getAttribute('data-upload-subject') || '';
  if (!fileInput) return;

  triggerBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (!targetPath || !targetPath.endsWith('.md')) {
      statusEl.className = 'lib-upload-status err';
      statusEl.textContent = '저장 경로 오류 (.md 아님)';
      return;
    }
    triggerBtn.disabled = true;
    statusEl.className = 'lib-upload-status pending';
    statusEl.textContent = 'Staging 업로드 중…';
    try {
      const content = await file.text();
      // Staging endpoint (뷰어 즉시 갱신 X — AI가 분석/머지 후 최종 저장)
      const resp = await fetch(`/api/staging/upload/${encodeURIComponent(subject)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'text/plain; charset=utf-8' },
        body: content
      });
      if (!resp.ok) {
        const errTxt = await resp.text().catch(() => '');
        throw new Error(`HTTP ${resp.status}${errTxt ? ' — ' + errTxt.slice(0, 80) : ''}`);
      }
      const result = await resp.json();
      statusEl.className = 'lib-upload-status ok';
      statusEl.textContent = `Staging 저장 완료 (${result.bytes} bytes, ${result.staged}). ${result.next_step}`;
      // 뷰어 자동 새로고침 X — 사용자가 AI 발화 후 최종 머지 시점에 갱신
    } catch (err) {
      statusEl.className = 'lib-upload-status err';
      statusEl.textContent = `실패: ${err.message || err}`;
      triggerBtn.disabled = false;
    } finally {
      // 동일 파일 재업로드 가능하도록 input 리셋
      fileInput.value = '';
    }
  });
}

function renderContent() {
  const content = document.getElementById('content');
  const editorWrap = document.getElementById('editor-wrap');
  const k = stealthMode ? 'fake' : 'real';
  const tabLabels = stealthUI.tabs[k];
  const tabKeys = ['원본', '전체', 'Lv.1', 'Lv.4'];

  // Case 메타 헤더 (풍부 메타가 있는 경우)
  const meta = fileMetadata[currentPath];

  // ─── 라이브러리(두문자 등) 분기: 탭 없이 전체 마크다운 렌더 + 업로드 UI ───
  if (meta && meta.type === 'library') {
    const caseLabel = stealthMode ? (stealthCategoryMap[meta.case] || meta.case || '') : (meta.case || '');
    const subjLine = `${displaySubject(meta.subjectKor)} · ${caseLabel}${meta.title ? ' · ' + meta.title : ''}`;
    const uploadKey = (meta.subjectKor || 'lib').replace(/[^a-zA-Z0-9가-힣]/g, '_');
    const headerHtml = `<div class="page-header">
      <span class="case-id-large">${escapeHtml(caseLabel)}</span>
      <span class="case-subject">${escapeHtml(subjLine)}</span>
      <div class="breadcrumb">${escapeHtml(displaySubject(meta.subjectKor))}<span class="crumb-sep">/</span>${escapeHtml(caseLabel)}</div>
    </div>`;
    const uploadBarHtml = `<div class="library-upload-bar" data-upload-path="${escapeAttr(currentPath)}" data-upload-subject="${escapeAttr(meta.subjectKor || '')}">
      <input type="file" id="lib-upload-${escapeAttr(uploadKey)}" accept=".md,text/markdown" style="display:none" />
      <button type="button" class="lib-upload-btn" data-upload-trigger="${escapeAttr(uploadKey)}">새 두문자 업로드 (Staging — AI가 분석 후 머지)</button>
      <span class="lib-upload-hint">현재 파일: <code>${escapeHtml(currentPath)}</code> — Staging 폴더 <code>_staging/</code>에 임시 저장. AI 발화로 최종 머지</span>
      <span class="lib-upload-status" id="lib-upload-status-${escapeAttr(uploadKey)}"></span>
    </div>`;
    content.innerHTML = headerHtml + uploadBarHtml + '<div id="mdContent"></div>';
    if (editorWrap) content.appendChild(editorWrap);
    const target = document.getElementById('mdContent');
    target.innerHTML = renderMd(fullContent || '');
    bindLibraryUpload();
    return;
  }

  let headerHtml = '';
  if (meta) {
    const shortId = `${meta.file}-${meta.case}`;
    const subjLine = stealthMode
      ? `${displaySubject(meta.subjectKor)} · ${displayCategory(meta.category)}${meta.points ? ' · ' + meta.points + ' pt' : ''}`
      : `${meta.subjectKor} · ${meta.category} · ${meta.title || ''}${meta.points ? ' · ' + meta.points + '점' : ''}${meta.userCase ? ' · User#' + meta.userCase : ''}`;
    headerHtml = `<div class="page-header">
      <span class="case-id-large">${escapeHtml(shortId)}</span>
      <span class="case-subject">${escapeHtml(subjLine)}</span>
      <div class="breadcrumb">${escapeHtml(displaySubject(meta.subjectKor))}<span class="crumb-sep">/</span>${escapeHtml(displayCategory(meta.category))}<span class="crumb-sep">/</span>${escapeHtml(displayFileKor(meta.fileKor, meta.file).replace(meta.subjectKor + '_', '').replace(meta.category + '_', ''))}<span class="crumb-sep">/</span>Case ${escapeHtml(meta.case)}</div>
    </div>`;
  }

  let tabs = '<div class="lv-tabs">';
  tabKeys.forEach((s, i) => {
    tabs += `<div class="lv-tab${i===1?' active':''}" data-key="${s}" onclick="showSection('${s}', event)">${tabLabels[i]}</div>`;
  });
  tabs += '</div>';
  content.innerHTML = headerHtml + tabs + '<div id="mdContent"></div>';
  if (editorWrap) content.appendChild(editorWrap);
  showSection('전체');
}

function showSection(section, event) {
  document.querySelectorAll('.lv-tab').forEach(t => t.classList.remove('active'));
  if (event) event.target.classList.add('active');
  else {
    document.querySelectorAll('.lv-tab').forEach(t => { if (t.dataset.key === section) t.classList.add('active'); });
  }

  const md = fullContent;
  const target = document.getElementById('mdContent');

  if (section === '전체') {
    const original = extractSection(md, '원본');
    const lv1 = extractSection(md, 'Lv.1 빠른복습');
    const lv4 = extractSection(md, 'Lv.4 암기노트');
    const k = stealthMode ? 'fake' : 'real';
    const labels = stealthUI.tabs[k];
    const originalLabel = stealthMode ? labels[0] : extractSectionHeader(md, '원본');
    target.innerHTML = `
      <table class="compare-table">
        <thead><tr><th>${originalLabel}</th><th>Lv.1</th><th>Lv.4</th></tr></thead>
        <tbody><tr>
          <td>${renderMd(original || '(없음)')}</td>
          <td>${renderMd(lv1 || '(없음)')}</td>
          <td>${renderMd(lv4 || '(없음)')}</td>
        </tr></tbody>
      </table>
    `;
    return;
  }

  let sectionKey, sectionHeader;
  if (section === '원본') { sectionKey = '원본'; sectionHeader = stealthMode ? '원본' : extractSectionHeader(md, '원본'); }
  else if (section === 'Lv.1') { sectionKey = 'Lv.1 빠른복습'; sectionHeader = 'Lv.1 빠른복습'; }
  else if (section === 'Lv.4') { sectionKey = 'Lv.4 암기노트'; sectionHeader = 'Lv.4 암기노트'; }

  const c = extractSection(md, sectionKey);
  target.innerHTML = c ? renderMd(`## ${sectionHeader}\n\n${c}`) : '<p style="color:#484f58;">해당 섹션을 찾을 수 없습니다.</p>';
}

function extractSection(md, sectionName) {
  const lines = md.split('\n');
  let capture = false;
  let result = [];
  for (const line of lines) {
    if (line.startsWith('## ') && line.includes(sectionName)) { capture = true; continue; }
    if (capture && line.startsWith('## ')) break;
    if (capture) result.push(line);
  }
  return result.join('\n').trim();
}

function extractSectionHeader(md, sectionName) {
  for (const line of md.split('\n')) {
    if (line.startsWith('## ') && line.includes(sectionName)) {
      return line.replace(/^##\s+/, '').trim();
    }
  }
  return sectionName;
}

function parseSubsections(section) {
  const result = {};
  const lines = section.split('\n');
  let current = null;
  let buffer = [];
  for (const line of lines) {
    const m = line.match(/^###\s+(.+)$/);
    if (m) {
      if (current) result[current] = buffer.join('\n').trim();
      current = m[1].trim();
      buffer = [];
    } else if (current) buffer.push(line);
  }
  if (current) result[current] = buffer.join('\n').trim();
  return result;
}

function stripEmphasis(text) {
  return text
    .replace(/\[red\]([\s\S]+?)\[\/red\]/g, '$1')
    .replace(/\[blue\]([\s\S]+?)\[\/blue\]/g, '$1')
    .replace(/\[bold\]([\s\S]+?)\[\/bold\]/g, '$1')
    .replace(/\[u\]([\s\S]+?)\[\/u\]/g, '$1')
    .replace(/\[blank2\]([\s\S]+?)\[\/blank2\]/g, '$1')
    .replace(/\[blank\]([\s\S]+?)\[\/blank\]/g, '$1');
}

function extractCaseNum(filename) {
  const m = filename.match(/미케(\d+)_(\d+)/);
  if (m) return `${parseInt(m[1], 10)}-${parseInt(m[2], 10)}`;
  const m2 = filename.match(/모고(\d+)_(\d+)/);
  if (m2) return `모고${parseInt(m2[1], 10)}-${parseInt(m2[2], 10)}`;
  return filename.replace('.md', '');
}

function isAnswerHeader(line) {
  const t = line.trim();
  return /^\d+\.\s+\S/.test(t) || /^\(\d+\)\s+\S/.test(t) || /^\d+\)\s+\S/.test(t);
}

function formatOriginalMerge(md, caseNum) {
  const section = stripEmphasis(extractSection(md, '원본'));
  const cleaned = section.split('\n').filter(l => !/^###\s+/.test(l)).join('\n').replace(/\n{3,}/g, '\n\n').trim();
  return `Case ${caseNum}.\n${cleaned}`;
}

function formatLv1Merge(md, caseNum) {
  const section = stripEmphasis(extractSection(md, 'Lv.1 빠른복습'));
  const sub = parseSubsections(section);
  let problem = (sub['문제'] || '').trim();
  const tocRaw = (sub['목차'] || '').trim();
  const answerRaw = (sub['답안'] || '').trim();
  if (problem.endsWith('.')) problem = problem.slice(0, -1) + '?';
  const tocItems = [];
  tocRaw.split('\n').forEach(line => {
    const t = line.trim();
    if (!t) return;
    let item = t.replace(/^\d+\.\s*/, '').replace(/^\(\d+\)\s*/, '').replace(/^\d+\)\s*/, '');
    if (!item) return;
    if (/^(결론|이유|사안의?\s*경우)$/.test(item)) return;
    tocItems.push(item);
  });
  const tocText = tocItems.map((it, i) => `목차 ${i+1}번, ${it},`).join('\n');
  const answerLines = answerRaw.split('\n').map(line => isAnswerHeader(line) ? '' : line);
  const compact = [];
  for (const line of answerLines) {
    if (line === '' && compact[compact.length-1] === '') continue;
    compact.push(line);
  }
  while (compact[0] === '') compact.shift();
  while (compact[compact.length-1] === '') compact.pop();
  return `Case ${caseNum}.\n${problem}\n${tocText}\n${compact.join('\n')}`;
}

function formatLv4Merge(md, caseNum) {
  const section = stripEmphasis(extractSection(md, 'Lv.4 암기노트'));
  const lines = section.split('\n').filter(l => l.trim());
  if (lines.length === 0) return `Case ${caseNum}. (Lv.4 없음)`;
  return `Case ${caseNum}. ${lines[0]}\n${lines.slice(1).join('\n')}`;
}

function openDownloadModal() {
  if (selectedFiles.size === 0) { alert('파일을 1개 이상 체크하세요'); return; }
  document.getElementById('modal-info').textContent = `${selectedFiles.size}개 파일 머지`;
  document.getElementById('download-modal').classList.add('show');
}
function closeModal() { document.getElementById('download-modal').classList.remove('show'); }

async function doDownload() {
  const level = document.querySelector('input[name="merge-level"]:checked').value;
  const files = Array.from(selectedFiles).sort();
  const parts = [];
  for (const filepath of files) {
    const slash = filepath.indexOf('/');
    const dir = filepath.slice(0, slash);
    const filename = filepath.slice(slash + 1);
    const res = await fetch(`${dir}/${filename}`);
    const md = await res.text();
    const caseNum = extractCaseNum(filename);
    let merged;
    if (level === '원본') merged = formatOriginalMerge(md, caseNum);
    else if (level === 'Lv.1') merged = formatLv1Merge(md, caseNum);
    else if (level === 'Lv.4') merged = formatLv4Merge(md, caseNum);
    parts.push(merged);
  }
  const blob = new Blob([parts.join('\n\n\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const today = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `merged_${level.replace('.', '')}_${selectedFiles.size}_${today}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeModal();
}

document.getElementById('search').addEventListener('input', e => renderTree(e.target.value));

// ─────────── 필터 버튼 wiring (17896 정본) ───────────
document.querySelectorAll('#sidebar .filter-row button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#sidebar .filter-row button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    CURRENT_FILTER = b.dataset.filter || 'all';
    renderTree(document.getElementById('search').value);
  });
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && editMode) {
    e.preventDefault();
    saveFile();
    return;
  }
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'b') toggleSidebar();
  if (e.key === 'z') toggleStealth();
  if (e.key === 'e') toggleEditor();
  if (e.key === 'Escape') {
    closeModal();
    if (editMode) toggleEditor();
  }
});

// ─────────── 편집 모드 ───────────
let editMode = false;
let originalContent = '';

function toggleEditor() {
  if (!editMode && !currentFile) {
    alert('파일을 먼저 선택하세요');
    return;
  }
  if (editMode) {
    const ta = document.getElementById('editor-textarea');
    if (ta && ta.value && ta.value !== originalContent) {
      if (!confirm('저장하지 않은 변경 사항이 있습니다. 버리시겠습니까?')) return;
    }
  }
  editMode = !editMode;
  document.body.classList.toggle('editing', editMode);
  document.getElementById('editor-toggle').classList.toggle('active', editMode);
  if (editMode) {
    originalContent = fullContent || '';
    document.getElementById('editor-textarea').value = originalContent;
    updateEditorPreview();
    setSaveStatus('', '');
  }
}

function updateEditorPreview() {
  const ta = document.getElementById('editor-textarea');
  const preview = document.getElementById('editor-preview');
  preview.innerHTML = renderMd(ta.value);
}

function wrapEmphasis(tag) {
  const ta = document.getElementById('editor-textarea');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  if (start === end) { setSaveStatus('텍스트를 먼저 선택하세요', 'error'); return; }
  const selected = ta.value.substring(start, end);
  const allTags = ['red', 'blue', 'bold', 'u', 'blank2', 'blank'];
  let cleaned = selected;
  for (const t of allTags) {
    const re = new RegExp(`\\[${t}\\]([\\s\\S]+?)\\[\\/${t}\\]`, 'g');
    cleaned = cleaned.replace(re, '$1');
  }
  const wrapped = tag === 'clear' ? cleaned : `[${tag}]${cleaned}[/${tag}]`;
  ta.setRangeText(wrapped, start, end, 'select');
  ta.focus();
  updateEditorPreview();
  setSaveStatus(tag === 'clear' ? '강조 제거' : `[${tag}] 적용`, 'success');
}

async function saveFile() {
  if (!editMode) return;
  if (!currentPath) { setSaveStatus('파일이 선택되지 않음', 'error'); return; }
  const ta = document.getElementById('editor-textarea');
  const newContent = ta.value;
  if (newContent === originalContent) {
    setSaveStatus('변경 사항 없음', 'success');
    return;
  }
  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true;
  setSaveStatus('저장 중...', '');
  try {
    const res = await fetch(`/api/save/${encodeURI(currentPath)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'text/plain; charset=utf-8' },
      body: newContent
    });
    if (res.ok) {
      const data = await res.json();
      setSaveStatus(`✓ 저장 완료 (${data.bytes} bytes)`, 'success');
      originalContent = newContent;
      fullContent = newContent;
    } else {
      const errText = await res.text().catch(() => '');
      setSaveStatus(`✗ 저장 실패 (${res.status}): ${errText.slice(0, 80)}`, 'error');
    }
  } catch (e) {
    setSaveStatus(`✗ 네트워크 오류: ${e.message}`, 'error');
  } finally {
    saveBtn.disabled = false;
  }
}

function setSaveStatus(msg, kind) {
  const el = document.getElementById('save-status');
  if (!el) return;
  el.textContent = msg;
  el.className = 'save-status ' + (kind || '');
}

init();
</script>
