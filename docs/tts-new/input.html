<!-- marked.js (merge.html과 동일 — 마크다운 → HTML 변환) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
// ============================================================================
// 상수
// ============================================================================

// 25종 태그 — merge.html L1857 allTags 정확 mirror (순서 보존)
const ALL_TAGS = [
  'em1', 'em2', 'em3', 'em4',
  'con', 'fact', 'case', 'bridge', 'key',
  'free1', 'free2',
  'red', 'blue', 'purple', 'violet', 'magenta', 'indigo',
  'bold', 'u', 'blank2', 'blank'
];

// 3과목 → 폴더/파일 prefix 매핑 (design.md §4 / §10-5)
const SUBJECT_META = {
  '부동산등기법':     { folder: '2026_사용자_부동산등기법',    fileEn: 'budeunglaw' },
  '부동산등기서류':   { folder: '2026_사용자_부동산등기서류',  fileEn: 'budeungseoryu' },
  '민사서류':         { folder: '2026_사용자_민사서류',        fileEn: 'minsaseoryu' }
};

const TAB_KEYS = ['문제', '답안', '메모'];  // design.md §2 / §4 명세

// localStorage prefix (글로벌 룰 11-4: lawear_input_*)
const LS_PREFIX = 'lawear_input_draft_';

// ============================================================================
// 상태
// ============================================================================
let state = {
  subject: '',           // 한글 과목명 (예: '부동산등기법')
  caseNo: '01',          // case 번호 (zero-pad, 클라이언트 자동)
  activeTab: '문제',     // 현재 탭
  // 탭별 본문 (텍스트만 보관 — 미리보기는 매번 renderMd)
  texts: { '문제': '', '답안': '', '메모': '' },
  // 탭별 dirty 플래그 (저장되지 않은 변경 여부)
  dirty: { '문제': false, '답안': false, '메모': false },
  // 편집 모드 (편집이 디폴트, E 키로 토글 → 뷰어 redirect)
  // 진입 path (편집 진입 시 기존 .md 로드)
  loadedPath: null
};

// ============================================================================
// URL 파라미터 파싱 (?subject=&problem=&path=)
// ============================================================================
function parseUrlParams() {
  const params = new URLSearchParams(window.location.search);
  const subject = params.get('subject') || '';
  const problem = params.get('problem') || '';  // 예: "1-1" or "01"
  const path = params.get('path') || '';        // 편집 진입 시
  console.log('[init] URL params:', { subject, problem, path });
  return { subject, problem, path };
}

// 과목 prefill (URL → state)
function applySubjectFromUrl(subject) {
  if (!subject) return;
  if (!SUBJECT_META[subject]) {
    console.warn('[init] 알 수 없는 과목:', subject);
    return;
  }
  state.subject = subject;
  document.getElementById('subject-select').value = subject;
  console.log('[init] 과목 prefill:', subject);
}

// problem 파라미터 → caseNo 추출 (예: "1-1" → "01", "01" → "01")
function applyProblemFromUrl(problem) {
  if (!problem) return;
  // "1-1" 같은 형식이면 마지막 숫자만 추출
  const match = problem.match(/(\d+)$/);
  if (match) {
    state.caseNo = String(match[1]).padStart(2, '0');
    console.log('[init] caseNo:', state.caseNo, 'from problem:', problem);
  }
}

// ============================================================================
// 탭 렌더 (문제 / 답안 / 메모)
// ============================================================================
function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  TAB_KEYS.forEach(name => {
    const t = document.createElement('div');
    t.className = 'tab' + (name === state.activeTab ? ' active' : '');
    t.dataset.tab = name;
    const dirtyMark = state.dirty[name] ? '<span class="dirty">●</span>' : '';
    t.innerHTML = name + dirtyMark;
    t.onclick = () => switchTab(name);
    tabsEl.appendChild(t);
  });
}

// 탭 전환 — 현재 textarea 값을 state.texts에 저장 후 새 탭 로드
function switchTab(name) {
  if (name === state.activeTab) return;
  // 현재 탭 텍스트 저장 (revisit 시 복원)
  const ta = document.getElementById('editor-textarea');
  state.texts[state.activeTab] = ta.value;
  console.log('[switchTab]', state.activeTab, '→', name);
  state.activeTab = name;
  document.getElementById('active-tab-label').textContent = name;
  ta.value = state.texts[name];
  renderTabs();
  updatePreview();
}

// ============================================================================
// 헤더 breadcrumb 갱신
// ============================================================================
function updateBreadcrumb() {
  document.getElementById('bc-subject').textContent = state.subject || '(과목 미선택)';
  document.getElementById('bc-case').textContent = state.caseNo || '-';
}

// ============================================================================
// 실시간 미리보기 (textarea input → preview innerHTML)
// merge.html L793-822 renderMd 단순화 mirror — marked.js + tts-* 클래스 wrap
// ============================================================================
function renderMd(md) {
  if (!md || !md.trim()) return '<span class="empty">(빈 내용)</span>';

  // 1단계: 강조 태그를 플레이스홀더로 치환 (marked가 [tag]를 링크로 오해 방지)
  const placeholders = [];
  const tagPattern = ALL_TAGS.join('|');
  const tagRe = new RegExp(
    '\\[(' + tagPattern + ')\\]' +
    '((?:(?!\\[(?:' + tagPattern + ')\\])[\\s\\S])*?)' +
    '\\[\\/\\1\\]', 'g'
  );

  let escaped = md;
  let prev;
  let iter = 0;
  // 중첩 태그 처리 — 최대 20회 반복 (merge.html L805 mirror)
  do {
    prev = escaped;
    escaped = escaped.replace(tagRe, (m, tag, content) => {
      placeholders.push({ tag, content });
      return `@@EMP${placeholders.length - 1}@@`;
    });
    iter++;
  } while (escaped !== prev && iter < 20);

  // 2단계: 마크다운 → HTML
  let html;
  try {
    html = (typeof marked !== 'undefined') ? marked.parse(escaped) : escaped;
  } catch (e) {
    console.warn('[renderMd] marked 실패, 원문 노출:', e);
    html = escaped;
  }

  // 3단계: 플레이스홀더 복원 → tts-* span (재귀 — 중첩 강조 지원)
  function recover(s) {
    return s.replace(/@@EMP(\d+)@@/g, (m, i) => {
      const { tag, content } = placeholders[parseInt(i, 10)];
      // u → tts-underline, 나머지 → tts-{tag} (merge.html L816 mirror)
      const cls = tag === 'u' ? 'tts-underline' : 'tts-' + tag;
      return `<span class="${cls}">${recover(content)}</span>`;
    });
  }
  return recover(html);
}

function updatePreview() {
  const ta = document.getElementById('editor-textarea');
  const preview = document.getElementById('editor-preview');
  preview.innerHTML = renderMd(ta.value);
}

// textarea input 이벤트 — dirty 플래그 + 미리보기 + 자동저장(localStorage)
function onTextareaInput() {
  if (!state.dirty[state.activeTab]) {
    state.dirty[state.activeTab] = true;
    renderTabs();  // dirty 마크 표시
  }
  updatePreview();
  saveDraftLocal();  // localStorage 자동저장 (페이지 새로고침 대비)
}

// ============================================================================
// wrapEmphasis — merge.html L1851-1868 정확 mirror
// ============================================================================
function wrapEmphasis(tag) {
  const ta = document.getElementById('editor-textarea');
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  if (start === end) {
    setSaveStatus('텍스트를 먼저 선택하세요', 'error');
    return;
  }
  const selected = ta.value.substring(start, end);

  // 기존 강조 제거 (중첩 방지) — merge.html L1857-1860 mirror
  let cleaned = selected;
  for (const t of ALL_TAGS) {
    const re = new RegExp(`\\[${t}\\]([\\s\\S]+?)\\[\\/${t}\\]`, 'g');
    cleaned = cleaned.replace(re, '$1');
  }
  const wrapped = tag === 'clear' ? cleaned : `[${tag}]${cleaned}[/${tag}]`;
  ta.setRangeText(wrapped, start, end, 'select');
  ta.focus();

  // dirty + 미리보기 갱신
  if (!state.dirty[state.activeTab]) {
    state.dirty[state.activeTab] = true;
    renderTabs();
  }
  updatePreview();
  setSaveStatus(tag === 'clear' ? '강조 제거' : `[${tag}] 적용`, 'success');
}

// ============================================================================
// 저장 상태 표시 (toolbar 우측)
// ============================================================================
function setSaveStatus(msg, kind) {
  const el = document.getElementById('save-status');
  el.textContent = msg;
  el.className = 'save-status' + (kind ? ' ' + kind : '');
  if (kind === 'success' && !msg.startsWith('✓')) {
    // 단기 성공 메시지는 3초 후 제거
    setTimeout(() => {
      if (el.textContent === msg) {
        el.textContent = '';
        el.className = 'save-status';
      }
    }, 3000);
  }
}

// ============================================================================
// localStorage 자동 임시저장 (페이지 새로고침 대비)
// 키: lawear_input_draft_{과목}_{caseNo}
// ============================================================================
function draftKey() {
  return LS_PREFIX + (state.subject || 'unknown') + '_' + state.caseNo;
}

function saveDraftLocal() {
  if (!state.subject) return;
  const ta = document.getElementById('editor-textarea');
  state.texts[state.activeTab] = ta.value;
  const draft = JSON.stringify({
    subject: state.subject,
    caseNo: state.caseNo,
    texts: state.texts,
    savedAt: new Date().toISOString()
  });
  try {
    localStorage.setItem(draftKey(), draft);
  } catch (e) {
    console.warn('[saveDraftLocal] localStorage 실패:', e);
  }
}

function loadDraftLocal() {
  if (!state.subject) return false;
  try {
    const raw = localStorage.getItem(draftKey());
    if (!raw) return false;
    const draft = JSON.parse(raw);
    state.texts = draft.texts || state.texts;
    console.log('[loadDraftLocal] 임시본 로드:', draftKey(), 'savedAt:', draft.savedAt);
    return true;
  } catch (e) {
    console.warn('[loadDraftLocal] 실패:', e);
    return false;
  }
}

function clearDraftLocal() {
  try {
    localStorage.removeItem(draftKey());
    console.log('[clearDraftLocal] 임시본 삭제:', draftKey());
  } catch (e) { /* ignore */ }
}

// ============================================================================
// .md 멀티섹션 조립 (design.md §4 포맷)
// ============================================================================
function assembleMd() {
  // 진입 시 마지막 탭 텍스트도 state에 저장
  const ta = document.getElementById('editor-textarea');
  state.texts[state.activeTab] = ta.value;

  const meta = SUBJECT_META[state.subject];
  if (!meta) throw new Error('과목 미선택');

  const id = `2026_${meta.fileEn}_user_${state.caseNo}`;
  const today = new Date().toISOString().slice(0, 10);

  const lines = [];
  lines.push(`# ${id}`);
  lines.push('');
  lines.push('## 메타');
  lines.push(`- 과목: ${state.subject}`);
  lines.push(`- Case: ${state.caseNo}`);
  lines.push(`- 등록일: ${today}`);
  lines.push('- 출처: 사용자 직접 입력');
  lines.push('- _addedBy: lawear-7ad6-input-mode');
  lines.push('');
  lines.push('## 문제');
  lines.push(state.texts['문제'] || '');
  lines.push('');
  lines.push('## 답안');
  lines.push(state.texts['답안'] || '');
  // 메모는 비어있으면 섹션 생략 (design.md §4 명세)
  const memo = (state.texts['메모'] || '').trim();
  if (memo) {
    lines.push('');
    lines.push('## 메모');
    lines.push(memo);
  }
  lines.push('');
  return lines.join('\n');
}

// 상대 경로 조립 (예: 2026_사용자_부동산등기법/2026_budeunglaw_user_01.md)
function buildRelPath() {
  const meta = SUBJECT_META[state.subject];
  if (!meta) return null;
  return `${meta.folder}/2026_${meta.fileEn}_user_${state.caseNo}.md`;
}

// ============================================================================
// 저장 API 호출 — POST /api/create/<rel_path> (design.md §3)
// 409 (이미 존재) 시 caseNo +1 재시도 (최대 99까지)
// ============================================================================
async function saveFile() {
  console.log('[saveFile] 저장 시작 — subject:', state.subject, 'caseNo:', state.caseNo);
  if (!state.subject) {
    setSaveStatus('과목을 먼저 선택하세요', 'error');
    return;
  }
  // 최소 검증: 문제 또는 답안 둘 다 비어있으면 저장 거부
  const ta = document.getElementById('editor-textarea');
  state.texts[state.activeTab] = ta.value;
  if (!state.texts['문제'].trim() && !state.texts['답안'].trim()) {
    setSaveStatus('문제 또는 답안 중 하나는 입력해야 합니다', 'error');
    return;
  }

  const saveBtn = document.getElementById('btn-save');
  saveBtn.disabled = true;
  setSaveStatus('저장 중…', '');

  // 409 재시도 루프 (최대 99회 — caseNo zero-pad 한도)
  let attempts = 0;
  const maxAttempts = 99;
  while (attempts < maxAttempts) {
    const relPath = buildRelPath();
    const body = assembleMd();
    const url = `/api/create/${encodeURI(relPath)}`;
    console.log('[saveFile] API 호출:', url, 'attempt:', attempts + 1);

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain; charset=utf-8' },
        body: body
      });
      console.log('[saveFile] 응답:', res.status, res.statusText);

      if (res.status === 409) {
        // 이미 존재 — caseNo +1 재시도
        console.log('[saveFile] 409 충돌 — caseNo 증가');
        const nextNo = String(parseInt(state.caseNo, 10) + 1).padStart(2, '0');
        state.caseNo = nextNo;
        updateBreadcrumb();
        attempts++;
        continue;
      }

      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        setSaveStatus(`✗ 저장 실패 (${res.status}): ${errText.slice(0, 80)}`, 'error');
        console.error('[saveFile] 실패:', res.status, errText);
        return;
      }

      const data = await res.json().catch(() => ({}));
      console.log('[saveFile] 성공:', data);
      setSaveStatus(`✓ 저장 완료 (${data.bytes || '?'} bytes) → 뷰어 이동`, 'success');

      // dirty 초기화 + localStorage 임시본 삭제
      Object.keys(state.dirty).forEach(k => state.dirty[k] = false);
      clearDraftLocal();
      renderTabs();

      // 저장 성공 → merge.html 자동 이동 (design.md §6 명세)
      setTimeout(() => {
        window.location.href = `/merge.html?path=${encodeURIComponent(relPath)}`;
      }, 800);
      return;
    } catch (e) {
      console.error('[saveFile] 네트워크 오류:', e);
      setSaveStatus(`✗ 네트워크 오류: ${e.message}`, 'error');
      return;
    } finally {
      saveBtn.disabled = false;
    }
  }

  setSaveStatus(`✗ caseNo 한도 초과 (${maxAttempts})`, 'error');
}

// ============================================================================
// 뷰어로 돌아가기 (저장 X — confirm 후 이동)
// ============================================================================
function goToViewer() {
  const hasDirty = Object.values(state.dirty).some(d => d);
  if (hasDirty) {
    if (!confirm('저장하지 않은 변경 사항이 있습니다. 뷰어로 이동하시겠습니까?')) return;
  }
  // path가 있으면 해당 파일로, 없으면 메인 뷰어로
  if (state.loadedPath) {
    window.location.href = `/merge.html?path=${encodeURIComponent(state.loadedPath)}`;
  } else {
    window.location.href = '/merge.html';
  }
}

// ============================================================================
// 편집 진입 시 기존 .md 로드 (path 파라미터)
// merge.html L1419 loadFileByPath와 동일 패턴 — 정적 GET
// ============================================================================
async function loadExistingMd(path) {
  console.log('[loadExistingMd] 로드 시도:', path);
  try {
    const res = await fetch(path, { cache: 'no-store' });
    if (!res.ok) {
      console.warn('[loadExistingMd] 로드 실패:', res.status);
      return false;
    }
    const md = await res.text();
    console.log('[loadExistingMd] 로드 성공, 바이트:', md.length);

    // 섹션 추출 (merge.html L1595 extractSection 인라인 mirror)
    state.texts['문제'] = extractSection(md, '문제');
    state.texts['답안'] = extractSection(md, '답안');
    state.texts['메모'] = extractSection(md, '메모');

    // 메타에서 과목/case 추출 시도
    const subjectMatch = md.match(/^- 과목:\s*(.+)$/m);
    if (subjectMatch && SUBJECT_META[subjectMatch[1].trim()]) {
      state.subject = subjectMatch[1].trim();
      document.getElementById('subject-select').value = state.subject;
    }
    const caseMatch = md.match(/^- Case:\s*(\S+)$/m);
    if (caseMatch) state.caseNo = caseMatch[1].trim();

    state.loadedPath = path;
    return true;
  } catch (e) {
    console.error('[loadExistingMd] 예외:', e);
    return false;
  }
}

// merge.html L1595-1605 extractSection 정확 mirror
function extractSection(md, sectionName) {
  const lines = md.split('\n');
  let capture = false;
  let result = [];
  for (const line of lines) {
    if (line.startsWith('## ') && line.includes(sectionName)) { capture = true; continue; }
    if (capture && line.startsWith('## ')) break;
    if (capture) result.push(line);
  }
  return result.join('\n').trim();
}

// ============================================================================
// 키보드 단축키 (merge.html L1803-1817 mirror)
//   Cmd/Ctrl + S → 저장
//   E         → 편집 토글 (편집이 디폴트 → 뷰어 redirect)
// ============================================================================
document.addEventListener('keydown', (e) => {
  // Cmd/Ctrl + S 저장
  if ((e.metaKey || e.ctrlKey) && e.key === 's') {
    e.preventDefault();
    console.log('[keydown] Cmd/Ctrl+S → saveFile');
    saveFile();
    return;
  }
  // E 키 — textarea 포커스 중에는 무시 (글자 입력 방해 X)
  if (e.key.toLowerCase() === 'e' && !e.metaKey && !e.ctrlKey && !e.altKey) {
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'TEXTAREA' || ae.tagName === 'INPUT' || ae.tagName === 'SELECT')) return;
    e.preventDefault();
    console.log('[keydown] E → 뷰어로 이동');
    goToViewer();
  }
});

// ============================================================================
// 과목 셀렉트 변경 핸들러
// ============================================================================
document.getElementById('subject-select').addEventListener('change', (e) => {
  const newSubject = e.target.value;
  console.log('[subject-select] 변경:', state.subject, '→', newSubject);
  // dirty 있으면 confirm
  const hasDirty = Object.values(state.dirty).some(d => d);
  if (hasDirty && !confirm('변경 사항이 있습니다. 과목을 변경하면 임시본이 새 키로 이동합니다. 계속할까요?')) {
    e.target.value = state.subject;
    return;
  }
  state.subject = newSubject;
  state.caseNo = '01';   // 신규 과목 — caseNo 리셋
  state.texts = { '문제': '', '답안': '', '메모': '' };
  state.dirty = { '문제': false, '답안': false, '메모': false };
  state.activeTab = '문제';
  // localStorage에서 해당 과목 임시본 있으면 로드
  loadDraftLocal();
  document.getElementById('editor-textarea').value = state.texts[state.activeTab];
  updateBreadcrumb();
  renderTabs();
  updatePreview();
});

// ============================================================================
// 부팅
// ============================================================================
async function boot() {
  console.log('[boot] 시작');
  const { subject, problem, path } = parseUrlParams();

  // 편집 진입 (path 우선)
  if (path) {
    applySubjectFromUrl('');  // path 파일에서 메타로 덮어쓸 예정
    const ok = await loadExistingMd(path);
    if (!ok) setSaveStatus(`✗ 파일 로드 실패: ${path}`, 'error');
  } else {
    // 신규 진입
    applySubjectFromUrl(subject);
    applyProblemFromUrl(problem);
    // 임시본 자동 복원
    if (state.subject) loadDraftLocal();
  }

  state.activeTab = '문제';
  document.getElementById('active-tab-label').textContent = '문제';
  document.getElementById('editor-textarea').value = state.texts['문제'];
  updateBreadcrumb();
  renderTabs();
  updatePreview();
  console.log('[boot] 완료 — state:', state);
}

boot();
</script>
